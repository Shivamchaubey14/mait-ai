version: 2

updates:
  - package-ecosystem: pip
    directory: /backend/requirements
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per group rather than per package — a wall of individual bumps gets
      # rubber-stamped, which defeats the point of reviewing them at all.
      django:
        patterns: ["django", "djangorestframework*", "drf-*", "django-*"]
      celery:
        patterns: ["celery", "flower", "redis", "django-celery-*"]
      dev-tooling:
        patterns: ["pytest*", "ruff", "black", "mypy*", "factory-boy", "pre-commit"]
      # Catch-all so anything not matched above still arrives as one PR rather than as a
      # dozen. Security updates bypass grouping and always come through individually.
      other:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "mobile"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      react-native:
        patterns: ["react-native*", "@react-native*", "react", "react-dom"]
      redux:
        patterns: ["@reduxjs/*", "react-redux"]
      dev-tooling:
        patterns: ["jest*", "@testing-library/*", "eslint*", "prettier", "typescript"]
      other:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /admin-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies", "admin-web"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies", "infra"]
    commit-message:
      prefix: "chore(deps)"
