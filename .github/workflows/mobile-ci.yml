name: Mobile CI

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Jest
        run: npm test -- --coverage --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high

  native-project:
    name: Check the native project exists
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # `android/` is generated by react-native init on a machine with the Android SDK and
        # is not committed yet. Until it is, there is nothing to assemble — skip rather than
        # fail, so a red X does not become the normal state of this workflow.
        run: |
          if [ -f mobile/android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::mobile/android is absent — skipping the release build. See mobile/README.md."
          fi

  android-build:
    name: Android release build
    # Only on merge — a full Gradle build on every PR push would dominate CI time for no
    # benefit, since lint and tests already gate correctness.
    if: github.event_name == 'push' && needs.native-project.outputs.present == 'true'
    runs-on: ubuntu-latest
    needs: [quality, native-project]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: npm ci

      - name: Assemble release bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mait-app-${{ github.sha }}.aab
          path: mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
