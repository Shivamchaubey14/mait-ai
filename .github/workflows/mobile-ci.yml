name: Mobile CI

on:
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["mobile/**", ".github/workflows/mobile-ci.yml"]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Jest
        run: npm test -- --coverage --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: mobile/coverage
          if-no-files-found: ignore

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high

  expo-config:
    name: Expo config & bundle
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Check dependency versions match the Expo SDK
        # A package outside the range its SDK expects usually fails at runtime on the device
        # rather than here, which makes it expensive to find. Catch it in CI instead.
        run: npx expo install --check

      - name: Export the bundle
        # Proves the app actually bundles. Lint and tests can both pass while a bad import
        # or a missing native module leaves the app unable to start.
        run: npx expo export --platform android --output-dir ./dist-check

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: expo-bundle-${{ github.sha }}
          path: mobile/dist-check
          retention-days: 7
          if-no-files-found: warn

  # Release builds go through EAS Build rather than Gradle — this is a managed Expo project
  # with no committed android/ or ios/ folder. Wire `eas build` in here once an Expo account
  # and EXPO_TOKEN exist; until then the export above is what proves the app is buildable.
