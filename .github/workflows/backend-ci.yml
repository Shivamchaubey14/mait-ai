name: Backend CI

# Path-filtered so a mobile-only change does not run the Django suite (ADR 0001).
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install tooling
        run: pip install ruff==0.6.4 black==24.8.0

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Black
        run: black --check --diff .

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # Real MySQL, not SQLite: the inventory invariant depends on InnoDB row locking and
      # check constraints, and SQLite would let a broken implementation pass (ADR 0002).
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_maitai
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: pip install -r requirements/dev.txt

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_maitai
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py migrate --noinput

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_maitai
          REDIS_URL: redis://127.0.0.1:6379/0
        # A model change without its migration breaks the next deploy, not this PR — which
        # is exactly why it has to fail here.
        run: python manage.py makemigrations --check --dry-run

      - name: Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_maitai
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  schema:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - run: pip install -r requirements/dev.txt

      - name: Generate schema
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_maitai
        run: python manage.py spectacular --file /tmp/openapi.yaml --validate

      - name: Fail on contract drift
        # The contract is frozen and three workstreams build against it. A silent change
        # here would surface as a mobile bug days later.
        run: |
          if [ -f openapi.yaml ]; then
            diff -u openapi.yaml /tmp/openapi.yaml || {
              echo "::error::openapi.yaml is out of date. Run 'make schema' and commit the result."
              exit 1
            }
          else
            echo "::notice::No committed openapi.yaml yet — run 'make schema' once routes exist."
          fi

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install pip-audit==2.7.3 bandit==1.7.9

      - name: pip-audit
        run: pip-audit -r requirements/base.txt --strict

      - name: Bandit
        run: bandit -r apps config -ll -x "*/tests/*,*/migrations/*"

  docker:
    name: Image build & scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: maitai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: maitai-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
