name: Admin Web CI

on:
  pull_request:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
  push:
    branches: [main, develop]
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin-web

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: HTML validation
        run: npm run validate:html

  design-tokens:
    name: Design token discipline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The palette must stay in tokens.css. A hex literal scattered through a stylesheet
      # is what makes a rebrand a week of grep instead of one edit (docs/DESIGN_SYSTEM.md).
      - name: Reject hardcoded hex colours outside tokens.css
        run: |
          offenders=$(grep -rniE '#[0-9a-f]{6}\b' \
            --include='*.css' --include='*.js' --include='*.html' . \
            | grep -v 'assets/css/tokens.css' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Hardcoded colours found. Use a var(--color-*) token instead."
            echo "$offenders"
            exit 1
          fi

  e2e:
    name: Cypress E2E
    # Runs on merge, where a live API is available to exercise the upload and dashboard
    # flows end to end.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - run: npm ci

      - name: Cypress
        run: npm run test:e2e -- --headless
        env:
          CYPRESS_BASE_URL: http://localhost:8080

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-artifacts
          path: |
            admin-web/cypress/screenshots
            admin-web/cypress/videos
          if-no-files-found: ignore
