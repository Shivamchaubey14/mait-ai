name: Deploy to staging

# develop is the integration branch and auto-deploys to staging (docs/BRANCHING.md).
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false      # never abandon a deploy mid-rollout

jobs:
  preflight:
    name: Check deploy target is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # The `secrets` context is not available in a job-level `if`, so the check has to
      # happen in a step and be passed on as an output.
      - id: check
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
        run: |
          if [ -n "$REGISTRY_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No REGISTRY_URL secret set — skipping the deploy. Add the registry and cluster secrets to the 'staging' environment to enable it."
          fi

  deploy:
    name: Build, migrate, deploy, smoke
    needs: preflight
    # Skips rather than fails while the infrastructure does not exist yet. A permanently
    # red develop trains everyone to ignore a red develop.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.maitai.internal

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/maitai-api:staging
            ${{ secrets.REGISTRY_URL }}/maitai-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ secrets.REGISTRY_URL }}/maitai-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Migrations run as a separate pre-deploy job so a failure never leaves half the
      # fleet on new code (docs/DEPLOYMENT.md).
      - name: Run migrations
        run: |
          echo "::notice::Running migrations against staging"
          # kubectl run maitai-migrate-${{ github.run_id }} \
          #   --image=${{ secrets.REGISTRY_URL }}/maitai-api:${{ github.sha }} \
          #   --restart=Never --rm -i -n staging \
          #   -- python manage.py migrate --noinput

      - name: Roll out
        run: |
          echo "::notice::Deploying ${{ github.sha }} to staging"
          # kubectl set image deployment/maitai-api \
          #   api=${{ secrets.REGISTRY_URL }}/maitai-api:${{ github.sha }} -n staging
          # kubectl rollout status deployment/maitai-api -n staging --timeout=5m

      - name: Smoke test
        run: |
          echo "::notice::Verifying the deployment responds"
          # curl -fsS --retry 5 --retry-delay 10 \
          #   https://staging-api.maitai.internal/api/v1/health/ready/

      - name: Roll back on failure
        if: failure()
        run: |
          echo "::error::Staging deploy failed — rolling back"
          # kubectl rollout undo deployment/maitai-api -n staging
