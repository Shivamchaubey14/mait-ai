  /api/v1/ai-events/:
    get:
      operationId: ai_events_list
      description: 'Scoped to the caller: a Mait sees their own captures, an admin
        sees all of them. Filter with `status`, `mpp`, `mait`, `date_from` and `date_to`.'
      summary: List AI events
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mait
        schema:
          type: number
      - in: query
        name: mpp
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - draft
          - payment_pending
          - photo_captured
          - straw_verified
        description: |-
          * `draft` - Draft
          * `straw_verified` - Straw verified
          * `photo_captured` - Photo captured
          * `payment_pending` - Payment pending
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
        name: unfinished
        schema:
          type: boolean
      tags:
      - ai-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIEventList'
          description: ''
    post:
      operationId: ai_events_create
      description: |-
        Creates the capture and, when `straw_unique_no` is supplied, validates that straw against the Mait's stock in the same transaction — the event comes back as `straw_verified`. Omit the straw to keep a `draft` to return to.

        No stock is deducted here. Inventory moves only at completion, so an abandoned capture leaves the Mait's holding untouched.

        Send the device-generated `client_uuid` on every retry: a repeat returns `200` with the event already created rather than recording the insemination twice.
      summary: Start an AI event
      tags:
      - ai-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEventCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIEventCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIEventCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIEvent'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIEvent'
          description: ''
  /api/v1/ai-events/{id}/:
    get:
      operationId: ai_events_retrieve
      description: Capture and read AI events (SRS §6.3, §11).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai event.
        required: true
      tags:
      - ai-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIEventDetail'
          description: ''
  /api/v1/ai-events/{id}/complete/:
    post:
      operationId: ai_events_complete_create
      description: |-
        The only endpoint that moves inventory. Deduction and completion happen in one transaction with the inventory row locked, so two concurrent calls cannot both consume one straw (ADR 0002).

        Fails closed: `409` if the payment is not verified or the straw is no longer in the Mait's stock, and nothing is touched. Completing an event that is already complete is a no-op rather than an error — a retry whose first response was lost lands here, and the honest answer is that it is done.

        `close_without_stock` is for the record that is stuck: its straw has already left the holding, the insemination happened, and no further straw should be spent on it. Sent only from the app's *Close this off*, where the Mait has been shown what the record is missing. It is a permission rather than an instruction — a straw still in stock is deducted as normal — and where it does apply the event comes back with `stock_deducted: false` and a line on its audit trail.

        Send `Idempotency-Key` from the offline queue.
      summary: Complete the event and deduct the straw
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai event.
        required: true
      tags:
      - ai-events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIEventCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIEventCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIEventCompleteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIEvent'
          description: ''
  /api/v1/ai-events/{id}/photo/:
    patch:
      operationId: ai_events_photo_partial_update
      description: |-
        Multipart: `photo`, `gps_lat`, `gps_lng`, and optionally `performed_at`.

        `performed_at` is the device's clock, not the server's. An event captured offline may not arrive for hours, and the report must show when the insemination happened rather than when the phone found signal.

        `photo_source` says whether the picture came from the app's camera or the handset's gallery, and `gps_source` whether the pin is the handset's own position or what was written into the photograph. Both default to the live answer, and both are recorded on the event and its audit trail — a chosen photograph is accepted, never quietly passed off as a live one.

        Only valid from `straw_verified`: a photo without a checked straw is a photograph of an animal, not evidence of an insemination.
      summary: Attach the proof photo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai event.
        required: true
      tags:
      - ai-events
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAIEventPhotoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAIEventPhotoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIEvent'
          description: ''
  /api/v1/ai-events/{id}/timeline/:
    get:
      operationId: ai_events_timeline_list
      description: Every transition the event has been through, in order, with who
        made it. This is the record a dispute is settled from, so it is readable rather
        than raw.
      summary: Step-by-step audit trail
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ai event.
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mait
        schema:
          type: number
      - in: query
        name: mpp
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - draft
          - payment_pending
          - photo_captured
          - straw_verified
        description: |-
          * `draft` - Draft
          * `straw_verified` - Straw verified
          * `photo_captured` - Photo captured
          * `payment_pending` - Payment pending
          * `completed` - Completed
          * `cancelled` - Cancelled
      - in: query
        name: unfinished
        schema:
          type: boolean
      tags:
      - ai-events
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAIEventTimelineList'
          description: ''
  /api/v1/animals/:
    post:
      operationId: animals_create
      description: Belongs to exactly one of a member or a non-member. The ear tag
        is optional but unique across the platform when given, so a tag that already
        exists is rejected with the clash named rather than silently accepted.
      summary: Register an animal
      tags:
      - animals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/animals/{id}/:
    get:
      operationId: animals_retrieve
      description: Animals belonging to members and non-members at this Mait's MPPs
        (SRS §9.4).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this animal.
        required: true
      tags:
      - animals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
    patch:
      operationId: animals_partial_update
      description: Animals belonging to members and non-members at this Mait's MPPs
        (SRS §9.4).
      summary: Correct a breed or add an ear tag
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this animal.
        required: true
      tags:
      - animals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/animals/{id}/photo/:
    patch:
      operationId: animals_photo_partial_update
      description: |-
        Multipart: `photo`. Taken when the animal is registered, so the Mait recognises her on the next visit — most animals here carry no ear tag.

        Separate from registration rather than part of it: the animal must exist even if the upload fails, because the capture flow is standing on her id and a village connection is the least reliable thing in it.
      summary: Attach her portrait
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this animal.
        required: true
      tags:
      - animals
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnimalPhotoRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnimalPhotoRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: For Admin accounts. Maits authenticate through `/auth/otp/send/`
        and `/auth/otp/verify/` instead.
      summary: Log in with a username and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the refresh token so it cannot be exchanged again. The
        access token remains valid until it expires — it is short-lived by design
        (~15 min), and revoking it would mean a database lookup on every request,
        which is exactly what stateless JWT avoids.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The first call the mobile app makes after login. For a Mait it
        returns their assigned MPP codes, which scope everything the app will show.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/otp/send/:
    post:
      operationId: auth_otp_send_create
      description: |-
        Always returns 200, whether or not the number is registered. Confirming which numbers exist would let anyone enumerate the field workforce.

        A Mait whose SAP record has no mobile number cannot receive an OTP at all; an Admin sets one at activation (SRS §6.8.2).
      summary: Send a login OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
            examples:
              Request:
                value:
                  mobile_no: '9795402473'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Request:
                  value:
                    mobile_no: '9795402473'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Expires after 5 minutes; 3 wrong attempts force a resend (SRS §6.5.1).
        Every send and every attempt is logged for fraud review.
      summary: Verify a login OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/time/:
    get:
      operationId: auth_time_retrieve
      description: |-
        Server time, for the offline queue.

        The app timestamps events captured without connectivity, and field devices drift. This
        lets the client measure its own offset so a synced event reports when the insemination
        actually happened rather than when the phone thought it did (SRS §6.3.2).
      summary: Server time
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/config/breeds/:
    get:
      operationId: config_breeds_list
      description: Filter with `?animal_type=COW` or `BUFF`. The app pulls the whole
        list at login and caches it, so the picker keeps working with no signal (SRS
        §6.3.2).
      summary: Breed options by animal type
      parameters:
      - in: query
        name: animal_type
        schema:
          type: string
        description: COW or BUFF
      tags:
      - animals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreedConfig'
          description: ''
  /api/v1/config/products/:
    get:
      operationId: config_products_list
      description: |-
        The product catalogue behind the stock request form, split by category.

        Straws are absent on purpose: they are requested by breed, and the breed list is its own config endpoint (`/config/breeds/`).

        Consumables are used up and asked for by the dozen; equipment is issued once and kept. A Mait requesting five AI guns is a mistake, five boxes of gloves is a Tuesday — so the form treats them differently.
      summary: What a Mait can ask for
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Consumable'
          description: ''
  /api/v1/dashboard/activation-readiness/:
    get:
      operationId: dashboard_activation_readiness_retrieve
      description: 2,886 of 3,110 Sahayak records arrive from SAP with no mobile number,
        and OTP is a Mait's only way in (docs/DATA_FINDINGS.md §1). Surfaced on the
        dashboard because it blocks rollout, not because it is a curiosity.
      summary: Maits awaiting a mobile number
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboard/mait-performance/:
    get:
      operationId: dashboard_mait_performance_retrieve
      description: |-
        AI count and collections per Mait over a date range, ranked by count (SRS §6.7.4).

        `?date_from=` and `?date_to=` are inclusive local days. `?days=N` is the older form and still works, meaning the last N days ending today. Neither given means the last 30 days.

        **The recent tail is counted live and only the older days come off the aggregate**, the same split `/dashboard/trends/` makes and for the same reason: the hourly job rewrites the last `AGGREGATE_LOOKBACK_DAYS` days wholesale, so a day inside that window is either missing, an hour behind, or about to change. This used to overlay only today, which left yesterday reading off a table that was still being written — and on a deployment with no worker running, every day since somebody last ran `rebuild_ai_aggregates` by hand.

        `count` is how many Maits worked in the range; `results` is the top `MAX_LEADERBOARD_ROWS` of them.
      summary: Per-Mait performance
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD, inclusive
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD, inclusive
      - in: query
        name: days
        schema:
          type: integer
        description: Last N days ending today
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboard/mpp-coverage/:
    get:
      operationId: dashboard_mpp_coverage_retrieve
      description: |-
        Members served versus total members per MPP for a window (SRS §6.7.5). Coverage is what tells the business where the service is reaching people and where it is not: a member counts once however many inseminations they bought, so an MPP cannot look covered because one farmer is a heavy user.

        `summary` is the whole network — every active MPP that has members. `results` is the leaderboard's worth of that, the largest MPPs by member count, so the two must not be confused: totalling `results` describes the villages shown and nothing more.
      summary: MPP coverage
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Window in days, counted on `completed_at`. Default 30, capped
          at 365.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboard/summary/:
    get:
      operationId: dashboard_summary_retrieve
      description: |-
        AI events today, this week, this month and lifetime, the all-time highs, and the exception queues (SRS §6.7.1, §6.7.2, §6.7.6) and conception rate (§9.11).

        The month comparison is against the *same day* last month, not the whole of it — a month-to-date total against a completed month always looks like a collapse.
      summary: Headline counts and exceptions
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/dashboard/trends/:
    get:
      operationId: dashboard_trends_retrieve
      description: |-
        Completed and pending-payment counts per day, for the trend chart (SRS §6.7.3).

        Every day in the window is returned, including the empty ones. A chart that skips quiet days silently compresses time and makes a bad week look normal.

        The last few days are counted from the events themselves rather than from the aggregate tables, because the hourly job is still rewriting them; older days come off the aggregate. So the recent end of this series always agrees with `/dashboard/summary/`, however long ago the job last ran.
      summary: AI events per day
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Window size, up to 120. Default 30.
      - in: query
        name: district_code
        schema:
          type: string
        description: Restrict to one district.
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/farmers/otp/send/:
    post:
      operationId: farmers_otp_send_create
      description: |-
        The code goes to the number on the farmer's record, never to a number in the request. A Mait who could nominate the destination could nominate their own phone, and a verification a Mait can satisfy alone verifies nothing.

        A farmer whose record carries no mobile number cannot be verified at all, and is refused here rather than at the end of the capture.
      summary: Send a farmer verification code
      tags:
      - master-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerKeyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmerKeyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmerKeyRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/farmers/otp/verify/:
    post:
      operationId: farmers_otp_verify_create
      description: Expires after five minutes; three wrong attempts force a resend.
        Expired, wrong and out-of-attempts are distinct problem types, because each
        needs a different action from a Mait standing in a yard.
      summary: Verify a farmer verification code
      tags:
      - master-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FarmerOTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FarmerOTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FarmerOTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Liveness — the process is up. Used by the Kubernetes liveness probe.
      summary: Liveness check
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: |-
        Readiness — dependencies are reachable.

        Failing readiness pulls the pod out of rotation without killing it, so a brief Redis
        blip degrades capacity instead of causing a crash loop (docs/DEPLOYMENT.md).
      summary: Readiness check
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/indents/:
    get:
      operationId: indents_list
      description: A Mait sees their own; an admin sees all. Filter with `status`,
        `sync_status`, `mait`, `search`, and `stale=true` for the ones nobody is moving.
      summary: List indents
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mait
        schema:
          type: number
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: stale
        schema:
          type: boolean
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - issued
          - rejected
          - requested
        description: |-
          * `requested` - Requested
          * `approved` - Approved
          * `issued` - Issued
          * `rejected` - Rejected
      - in: query
        name: sync_status
        schema:
          type: string
          enum:
          - failed
          - pending
          - synced
        description: |-
          * `pending` - Not yet pushed
          * `synced` - Pushed to Indent Easy
          * `failed` - Push failed
      tags:
      - indents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIndentList'
          description: ''
    post:
      operationId: indents_create
      description: |-
        Straws are requested by breed, not by straw number — which physical straws are issued is decided at the depot.

        Accepts an `Idempotency-Key`: the app queues indents offline alongside AI events, and a blind retry must not raise the request twice.
      summary: Raise a stock indent
      tags:
      - indents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IndentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IndentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/indents/{id}/:
    get:
      operationId: indents_retrieve
      description: Stock requests, raised by a Mait and watched by an admin (SRS §9.8).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indent request.
        required: true
      tags:
      - indents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/indents/{id}/approve/:
    post:
      operationId: indents_approve_create
      description: Agrees to the request. Moves no stock — that is `issue`.
      summary: Approve an indent
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indent request.
        required: true
      tags:
      - indents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/indents/{id}/confirm-collection/:
    post:
      operationId: indents_confirm_collection_create
      description: The Mait acknowledges that issued stock reached them. Moves no
        stock — the balance rose when it was issued — and is the only step in the
        chain the Mait owns. Allowed once, on an issued indent.
      summary: Confirm collection
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indent request.
        required: true
      tags:
      - indents
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/indents/{id}/issue/:
    post:
      operationId: indents_issue_create
      description: |-
        Credits the stock to the Mait and closes the indent.

        Straw requests take `straw_numbers` — the number printed on each straw handed over — and never a bare quantity: the app scans a straw against the Mait's stock, so a count with no numbers behind it credits a balance nothing can be scanned against. Consumable requests take `qty`.

        Issuing fewer than were requested is allowed and closes the indent; the remainder needs a fresh request.
      summary: Issue an approved indent
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indent request.
        required: true
      tags:
      - indents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndentIssueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IndentIssueRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IndentIssueRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/indents/{id}/reject/:
    post:
      operationId: indents_reject_create
      description: Declines the request. The reason is stored on the indent, where
        the Mait can read it, rather than only in the audit log.
      summary: Reject an indent
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this indent request.
        required: true
      tags:
      - indents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IndentRejectRequest'
          application/x-www-form-urlencoded:
