    get:
      operationId: admin_uploads_snapshots_retrieve_2
      description: |-
        The workbook this platform is currently running on, rebuilt and protected.

        Not a blank template — the templates are the SAP exports themselves, which this portal has always said. This is *what we last loaded*, so an admin about to re-upload a corrected master can open the one in force and check a column against it.

        **Protected, not sealed.** The sheet carries Excel's own protection, which stops the accidental edit — a stray keystroke, a dragged column — and can be removed by anyone who means to. It is not encryption, and one of these files is not evidence.

        404 where nothing has landed for that master yet.
      summary: Download the last upload of a master, locked
      parameters:
      - in: path
        name: upload_type
        schema:
          type: string
          pattern: ^[a-z]+$
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
