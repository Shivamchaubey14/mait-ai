    PasswordLoginRequest:
      type: object
      description: |-
        Username/password login for Admin accounts (SRS §9.1).

        Maits are excluded by design: they authenticate by mobile OTP and their accounts carry
        an unusable password. Allowing a password here would create a second, weaker way into a
        field account.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PatchedAIEventPhotoRequest:
      type: object
      description: |-
        The proof photo and where and when it was taken (SRS §6.3 step 5).

        ``performed_at`` comes from the device, not the server clock. An event captured offline
        may not reach us for hours, and the report has to show when the insemination actually
        happened — a server timestamp would quietly move every offline event to whenever the
        Mait next found signal.

        GPS is required. The photo alone proves an animal was photographed; the pin is what ties
        it to the village it was billed to.
      properties:
        photo:
          type: string
          format: binary
        gps_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        gps_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
        performed_at:
          type: string
          format: date-time
        photo_source:
          allOf:
          - $ref: '#/components/schemas/PhotoSourceEnum'
          default: camera
        gps_source:
          allOf:
          - $ref: '#/components/schemas/GpsSourceEnum'
          default: device
    PatchedAdminUserUpdateRequest:
      type: object
      description: Activate, deactivate or amend an account (SRS §6.8.1).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        mobile_no:
          oneOf:
          - type: string
            pattern: ^[6-9]\d{9}$
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        role:
          $ref: '#/components/schemas/Role412Enum'
        password:
          type: string
          writeOnly: true
          minLength: 10
        portal_sections:
          type: array
          items:
            $ref: '#/components/schemas/PortalSectionsEnum'
          description: Sidebar sections this account may open. The complete set, not
            an addition — anything missing from it is removed. Admins only.
    PatchedAnimalPhotoRequest:
      type: object
      description: |-
        Her portrait, taken at registration.

        No GPS and no timestamp, unlike a proof photo: this is not evidence of anything that
        happened, it is how a Mait recognises the animal on the next visit. Most animals in this
        data carry no ear tag, and "the black one at the back" is not a record.
      properties:
        photo:
          type: string
          format: binary
    PatchedAnimalUpdateRequest:
      type: object
      description: Correct a breed or add an ear tag later (SRS §9.4).
      properties:
        breed:
          type: string
          minLength: 1
          maxLength: 30
        ear_tag_no:
          type: string
          nullable: true
          maxLength: 20
    PatchedBreedConfigWriteRequest:
      type: object
      description: |-
        The admin's edit shape for the semen list (SRS §6.3 step 3, §6.6.1).

        ``code`` and ``animal_type`` are set once together: they are the pair every straw, indent
        and stock row keys on, and changing either would orphan the lot. Everything a Mait reads
        — both labels, the rate, the ordering — stays editable.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 60
        name_hi:
          type: string
          description: Devanagari label for the Hindi toggle.
          maxLength: 60
        animal_type:
          $ref: '#/components/schemas/AnimalTypeEnum'
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What a member is charged for one insemination of this breed,
            in rupees. She hands over nothing: the dairy deducts it from her milk
            payment at the next payout. Zero means not priced — the list is maintained
            by hand and a rate nobody has entered must not read as free.'
        non_member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What a non-member pays the Mait on the spot, in rupees. Kept
            apart from the member rate because the two are different prices for the
            same service: one is settled against a milk payout the dairy already owes,
            the other is cash in a yard.'
        display_order:
          type: integer
          maximum: 65535
          minimum: 0
        is_active:
          type: boolean
    PatchedConsumableWriteRequest:
      type: object
      description: |-
        The admin's edit shape for the catalogue (SRS §6.6.1).

        ``code`` is what indents, uploads and the app all key on, so it is set once at creation
        and never edited: renaming it would orphan every indent already raised against it. The
        display name is the editable one — that is what the wording on both screens comes from.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/CategoryEnum'
        unit:
          type: string
          minLength: 1
          maxLength: 20
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Cost of one unit, in rupees. Zero means not priced — the catalogue
            is maintained by hand and a rate nobody has entered yet must not read
            as free.
        display_order:
          type: integer
          maximum: 65535
          minimum: 0
        is_active:
          type: boolean
    PatchedMPPAssignmentRequest:
      type: object
      description: |-
        Reassign an MPP to a different Mait (SRS §6.2.2).

        Overrides the SAP-derived default. The assignment is what scopes a Mait's app, so
        changing it moves both the MPP and its members out of one Mait's view and into another's.
      properties:
        sahayak_vendor_code:
          type: string
          nullable: true
          minLength: 1
          description: Null unassigns the MPP, leaving it visible to admins only.
    PatchedMaitUpdateRequest:
      type: object
      description: |-
        Correct one Mait's row from the assignment screen (SRS §6.2.2).

        Mobile and MPP coverage together, because they are corrected together: an operator on the
        phone to a Sahayak fixes the number they can be reached on and the villages they actually
        cover in one conversation.

        Every field is optional and absence means "leave alone" — a screen that sent the whole
        object back would wipe whatever it had not loaded.
      properties:
        name:
          type: string
          maxLength: 150
        mobile_no:
          type: string
          maxLength: 15
        mpp_codes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 15
          description: The complete set this Mait covers. An empty list clears their
            coverage.
    PatchedNonMemberAadhaarRequest:
      type: object
      description: |-
        Both faces of her Aadhaar card, photographed at registration.

        Sent after the record exists rather than as part of creating it, the same way an animal's
        portrait and a proof photo are. A registration that has already succeeded must not be
        undone by a village connection dropping a JPEG — the flow is standing on her id by then,
        and losing it costs the Mait the whole form again with the farmer waiting.

        Either face may be sent alone, so a retry only re-sends what failed, but at least one must
        be present: an empty request is a Mait who thinks they have uploaded something.
      properties:
        front:
          type: string
          format: binary
        back:
          type: string
          format: binary
    PatchedPayoutSchemeRequest:
      type: object
      description: |-
        The four figures the payout is computed from, editable from the report's own screen.

        Not a constant in a build, for the reason `payments.pricing` gives about the insemination
        rate: these are the terms of a field agent's engagement and they change by negotiation.
        A dairy that renegotiates should not have to ask an engineer to change somebody's pay.

        The consumable rates are deliberately absent — they belong to `Consumable.rate` and are
        maintained on Products, so there is one place per price.
      properties:
        commission_per_ai:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Paid to the Mait for one completed insemination, in rupees.
        monthly_fixed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: A flat monthly amount on top of the commission, paid only to
            a Mait who reached `fixed_min_ai` inseminations in the month. Zero switches
            it off.
        fixed_min_ai:
          type: integer
          maximum: 65535
          minimum: 0
          description: Inseminations needed in the month to earn `monthly_fixed_amount`.
            The test is 'at least this many' — a Mait on exactly the threshold earns
            it.
        straw_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Recovered from the payout for each semen straw issued to the
            Mait during the month, in rupees. Consumables are recovered at `Consumable.rate`
            instead — the Products screen owns those.
    PatchedPregnancyRateRequest:
      type: object
      description: |-
        The two prices, as the Rates screen edits them.

        Zero is allowed and means *not priced*; negative is not. There is no such thing as being
        paid to examine an animal, and a minus sign typed into a rupee field is a typo every time.
      properties:
        member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What a member is charged for one pregnancy diagnosis, in rupees.
            She hands over nothing: the dairy deducts it from her milk payment at
            the next payout. Zero means not priced, never free.'
        non_member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: What a non-member pays the Mait on the spot, in rupees. Zero
            means not priced, never free.
    Payment:
      type: object
      description: Read shape for one payment.
      properties:
        id:
          type: integer
          readOnly: true
        ai_event:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeAe4Enum'
          readOnly: true
        mode_display:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA39Enum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
        member_otp_verified:
          type: boolean
          readOnly: true
        cod_otp_verified:
          type: boolean
          readOnly: true
        utr_number:
          type: string
          readOnly: true
        payment_screenshot_url:
          type: string
          readOnly: true
        failure_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_event
      - amount
      - cod_otp_verified
      - created_at
      - failure_reason
      - id
      - is_verified
      - member_otp_verified
      - mode
      - mode_display
      - payment_screenshot_url
      - status
      - status_display
      - utr_number
    PaymentInitiateModeEnum:
      enum:
      - COD
      - ONLINE
      type: string
      description: |-
        * `COD` - COD
        * `ONLINE` - ONLINE
    PaymentInitiateRequest:
      type: object
      description: |-
        How she is paying.

        The mode is the Mait's to choose only for a non-member, who is the only farmer who hands
        anything over. A member's is decided by the server — the dairy takes it out of her milk
        payment — and a request that tries to name one for her is ignored rather than refused,
        because the answer was never the app's to give.
      properties:
        mode:
          $ref: '#/components/schemas/PaymentInitiateModeEnum'
    PaymentOTPRequest:
      type: object
      properties:
        otp:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - otp
    PaymentProofRequest:
      type: object
      description: |-
        Proof of an online payment: the reference she read out, and the screen she paid on.

        Both, not either. A UTR without a screenshot is a number a Mait could invent, and a
        screenshot without a UTR is an image nobody can reconcile against a bank statement.
      properties:
        utr_number:
          type: string
          minLength: 1
          maxLength: 40
        screenshot:
          type: string
          format: binary
      required:
      - screenshot
      - utr_number
    PaymentSummary:
      type: object
      description: Just enough payment to read an AI event row without opening it.
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeAe4Enum'
          readOnly: true
        mode_display:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA39Enum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
      required:
      - amount
      - is_verified
      - mode
      - mode_display
      - status
      - status_display
    PayoutScheme:
      type: object
      description: |-
        The four figures the payout is computed from, editable from the report's own screen.

        Not a constant in a build, for the reason `payments.pricing` gives about the insemination
        rate: these are the terms of a field agent's engagement and they change by negotiation.
        A dairy that renegotiates should not have to ask an engineer to change somebody's pay.

        The consumable rates are deliberately absent — they belong to `Consumable.rate` and are
        maintained on Products, so there is one place per price.
      properties:
        commission_per_ai:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Paid to the Mait for one completed insemination, in rupees.
        monthly_fixed_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: A flat monthly amount on top of the commission, paid only to
            a Mait who reached `fixed_min_ai` inseminations in the month. Zero switches
            it off.
        fixed_min_ai:
          type: integer
          maximum: 65535
          minimum: 0
          description: Inseminations needed in the month to earn `monthly_fixed_amount`.
            The test is 'at least this many' — a Mait on exactly the threshold earns
            it.
        straw_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Recovered from the payout for each semen straw issued to the
            Mait during the month, in rupees. Consumables are recovered at `Consumable.rate`
            instead — the Products screen owns those.
    PhotoSourceEnum:
      enum:
      - camera
      - gallery
      type: string
      description: |-
        * `camera` - Taken on the handset
        * `gallery` - Chosen from the gallery
    PortalSectionsEnum:
      enum:
      - dashboard
      - uploads
      - ai-events
      - maits
      - mpps
      - assignments
      - members
      - non-members
      - inventory
      - products
      - rates
      - indents
      - leaderboard
      - pregnancy
      - exceptions
      - reports
      - mait-payment
      - users
      - logs
      type: string
      description: |-
        * `dashboard` - Dashboard
        * `uploads` - SAP upload
        * `ai-events` - AI events
        * `maits` - Maits
        * `mpps` - MPPs
        * `assignments` - Assignment
        * `members` - Members
        * `non-members` - Non-members
        * `inventory` - Inventory
        * `products` - Products
        * `rates` - Rates
        * `indents` - Indents
        * `leaderboard` - Leaderboard
        * `pregnancy` - Pregnancy
        * `exceptions` - Exceptions
        * `reports` - Reports
        * `mait-payment` - Mait payment
        * `users` - Users & roles
        * `logs` - Audit log
    PregnancyCheck:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ai_event_id:
          type: integer
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        owner_type:
          type: string
          readOnly: true
        owner_mobile:
          type: string
          description: |-
            The owner's number, whichever kind of owner they are.

            Read the same way `get_owner_name` reads the name, off the same pair, so one farmer is
            one person across the record. Blank rather than null when there is none: a member's
            number is optional in the SAP master and a screen that has to tell null from "" is a
            screen with two empty states for one fact.
          readOnly: true
        mpp_id:
          type: integer
          readOnly: true
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        member_code:
          type: string
          readOnly: true
          default: ''
        non_member_id:
          type: integer
          readOnly: true
        animal_id:
          type: integer
          readOnly: true
        animal_type:
          type: string
          readOnly: true
        ear_tag_no:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
        gps_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
        gps_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
        gps_source:
          type: string
          readOnly: true
        served_on:
          type: string
          nullable: true
          readOnly: true
        due_on:
          type: string
          format: date
          readOnly: true
          description: Ninety days after the insemination, or a recheck's own date.
        days_until:
          type: integer
          description: Negative when overdue. The badge on the row is this number.
          readOnly: true
        days_since_ai:
          type: integer
          nullable: true
          description: How long she has been carrying, if she is. Shown on the recording
            screen.
          readOnly: true
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          readOnly: true
        outcome_display:
          type: string
          readOnly: true
        checked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        calving_due_on:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Set on a pregnant result and never recomputed after.
        photo_url:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        price:
          type: string
          nullable: true
          description: |-
            The rate this owner would pay for the visit, as a string, or null when unpriced.

            Null is not zero and the app must not render it as one. A rate nobody has entered is
            an administrator's omission, and the handset says the visit is chargeable without
            naming a figure rather than quoting a farmer nothing.

            Resolved once per response through the serializer context, because a page of a hundred
            checks would otherwise ask the same one-row table a hundred times.
          readOnly: true
        amount_charged:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - ai_event_id
      - amount_charged
      - animal_id
      - animal_type
      - breed
      - calving_due_on
      - checked_at
      - days_since_ai
      - days_until
      - due_on
      - ear_tag_no
      - gps_lat
      - gps_lng
      - gps_source
      - id
      - member_code
      - mpp_code
      - mpp_id
      - mpp_name
      - non_member_id
      - note
      - outcome
      - outcome_display
      - owner_mobile
      - owner_name
      - owner_type
      - photo_url
      - price
      - served_on
    PregnancyRate:
      type: object
      description: |-
        The two prices, as the Rates screen edits them.

        Zero is allowed and means *not priced*; negative is not. There is no such thing as being
        paid to examine an animal, and a minus sign typed into a rupee field is a typo every time.
      properties:
        service:
          allOf:
          - $ref: '#/components/schemas/ServiceEnum'
          readOnly: true
        member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What a member is charged for one pregnancy diagnosis, in rupees.
            She hands over nothing: the dairy deducts it from her milk payment at
            the next payout. Zero means not priced, never free.'
        non_member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: What a non-member pays the Mait on the spot, in rupees. Zero
            means not priced, never free.
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - service
      - updated_at
    ProductTypeEnum:
      enum:
      - straw
      - consumable
      type: string
      description: |-
        * `straw` - Semen straw
        * `consumable` - Consumable
    RecordCheckRequest:
      type: object
      description: |-
        What the handset sends back from the yard.

        `client_uuid` is minted when the Mait taps the outcome, not when the request goes out —
        a check is done without a signal as often as not, and a key generated at send time is new
        on every retry and deduplicates nothing (ADR 0003).
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        photo_url:
          type: string
          maxLength: 500
        note:
          type: string
          maxLength: 255
        client_uuid:
          type: string
          format: uuid
      required:
      - outcome
    RefTypeEnum:
      enum:
      - indent
      - ai_event
      - manual
      type: string
      description: |-
        * `indent` - Indent
        * `ai_event` - AI event
        * `manual` - Manual adjustment
    RelationEnum:
      enum:
      - father
      - husband
      type: string
      description: |-
        * `father` - Father
        * `husband` - Husband
    Role412Enum:
      enum:
      - super_admin
      - admin
      - mait
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `admin` - Admin / Back-office
        * `mait` - Mait (Field Agent)
    SemenBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        unique_straw_no:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
        bull_id:
          type: string
          readOnly: true
        semen_station:
          type: string
          readOnly: true
        received_date:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - breed
      - bull_id
      - id
      - received_date
      - semen_station
      - unique_straw_no
    ServiceEnum:
      enum:
      - pd
      type: string
      description: '* `pd` - Pregnancy diagnosis'
    StatusA39Enum:
      enum:
      - pending
      - verified
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `failed` - Failed
    StatusA5cEnum:
      enum:
      - draft
      - straw_verified
      - photo_captured
      - payment_pending
      - completed
      - cancelled
      type: string
      description: |-
        * `draft` - Draft
        * `straw_verified` - Straw verified
        * `photo_captured` - Photo captured
        * `payment_pending` - Payment pending
        * `completed` - Completed
        * `cancelled` - Cancelled
    StrawValidation:
      type: object
      description: |-
        The answer to a scan (SRS §6.3 step 4).

        ``reason`` is a stable machine-readable code, not a message. The app branches on it to
        tell the Mait what to actually do — "raise an indent" and "report this straw" are
        different actions, and a translated sentence cannot be branched on.
      properties:
        valid:
          type: boolean
        reason:
          type: string
          nullable: true
        straw:
          allOf:
          - $ref: '#/components/schemas/SemenBatch'
          nullable: true
        available_straws:
          type: integer
        breed_choices:
          type: array
          items:
            type: string
          description: Breeds the Mait holds as unnumbered stock. Present when `reason`
            is `breed_required`, so the app can ask instead of guessing.
      required:
      - available_straws
      - reason
      - straw
      - valid
    SyncStatusEnum:
      enum:
      - pending
      - synced
      - failed
      type: string
      description: |-
        * `pending` - Not yet pushed
        * `synced` - Pushed to Indent Easy
        * `failed` - Push failed
    TokenPair:
      type: object
      description: The JWT pair every successful login returns.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TxnTypeEnum:
      enum:
      - issue
      - consume
      - return
      - adjustment
      type: string
      description: |-
        * `issue` - Issued to Mait
        * `consume` - Consumed by AI event
        * `return` - Returned to store
        * `adjustment` - Manual adjustment
    UploadErrorRow:
      type: object
      description: One rejected row in the downloadable error report (SRS §6.1.4).
      properties:
        row:
          type: integer
          nullable: true
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
      required:
      - error
      - row
    UploadTypeEnum:
      enum:
      - member
      - mait
      - mpp
      - assignment
      type: string
      description: |-
        * `member` - Member Master
        * `mait` - Mait / Vendor Master
        * `mpp` - MPP / Sahayak Master
        * `assignment` - Mait ↔ MPP assignment
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
