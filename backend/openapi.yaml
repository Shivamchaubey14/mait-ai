      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Indent'
          description: ''
  /api/v1/mait/inventory/:
    get:
      operationId: mait_inventory_retrieve
      description: |-
        The Mait's current stock, in the shape the app gates on (SRS §6.4.1).

        Refreshed at login and after every completed AI and fulfilled indent.
