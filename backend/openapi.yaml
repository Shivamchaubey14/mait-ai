  /api/v1/admin/exceptions/{queue}/:
    get:
      operationId: admin_exceptions_retrieve
      description: |-
        One row per thing needing a human, in a shape shared by every queue so the portal has one dialog rather than six: `title`, `subtitle`, `detail`, `state`, `metric`, `when`, `guidance`, `facts` and `link`.

        `queue` is one of `pending-payments`, `low-stock`, `stale-indents`, `overdue-checks`, `declined-checks`. Failed OTPs has its own endpoint — `/admin/otp-failures/` — because deciding *why* a code failed needs the attempt count, the expiry and the clock read together, which is more than a row builder.

        **The predicates are shared with `/dashboard/summary/`**, so a card cannot say four above a dialog showing eleven.

        `buckets` names the causes present in the queue, for the dialog's filter chips; each row carries the one it is in. They are causes rather than statuses: a payment waiting on a farmer's authorisation and one waiting on a Mait's screenshot are the same status and two different phone calls.

        `?days=` applies only where the queue declares `windowed`.
      summary: The detail behind one Exceptions card
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: Window, where the queue has one
      - in: path
        name: queue
        schema:
          type: string
        required: true
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/inventory/:
    get:
      operationId: admin_inventory_retrieve
      description: |-
        Admin oversight of where the straws are (SRS §6.7.6). The Mait-facing endpoints only ever report the caller's own stock, so this is the only view that can answer who is about to run out.

        A Mait at zero is reported separately from one merely low: at zero they cannot record an AI event at all, which is a stopped Mait rather than a warning.
      summary: Stock across every Mait
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/inventory/{mait_id}/:
    get:
      operationId: admin_inventory_retrieve_2
      description: |-
        The same breakdown the Mait sees in the app — straws by breed, consumables and equipment — for whichever Mait is being looked at.

        The oversight list carries straw counts only, because that is what decides whether someone can work. This is the rest of the answer, for the moment an admin has a Mait on the phone.
      summary: One Mait's stock, for the admin
      parameters:
      - in: path
        name: mait_id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventorySummary'
          description: ''
  /api/v1/admin/non-members/:
    get:
      operationId: admin_non_members_list
      description: |-
        The farmers Maits registered in the field, for the back office (SRS §9.3, W10b).

        Separate from ``NonMemberViewSet`` rather than a permission branch on it, because the two
        answer different questions. That one is a Mait's own working set — scoped to what they
        created, because a Mait has no business reading another's farmers (SRS §16). This one is
        the whole population, and it exists because until now nobody outside the app could see it
        at all: a non-member is registered on a form that ends with cash changing hands, and the
        only oversight of that was the row's absence from every admin screen.

        Counts are annotated rather than serialised per row. A farmer with four animals and eleven
        inseminations is one row here, and a property that queried for each would be a page of
        fifty rows costing a hundred queries.
      summary: Search the non-members Maits have registered
      parameters:
      - in: query
        name: created_by_mait
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mpp__mpp_code
        schema:
          type: string
      - in: query
        name: no_card
        schema:
          type: boolean
        description: '`true` returns only the farmers missing one or both faces of
          their Aadhaar card — the rows the back office has to chase.'
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: relation
        schema:
          type: string
          enum:
          - father
          - husband
        description: |-
          Whether father_husband_name is her father or her husband.

          * `father` - Father
          * `husband` - Husband
      - in: query
        name: search
        schema:
          type: string
        description: Matches her name, her mobile number, or the household name.
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminNonMemberListList'
          description: ''
  /api/v1/admin/non-members/{id}/:
    get:
      operationId: admin_non_members_retrieve
      description: The only endpoint that returns the Aadhaar card image URLs. The
        Mait's own app is told a boolean instead, because a link to an identity document
        has no business in a handset's cache — an admin checking that the number typed
        matches the card has to see the card. **The read is audit-logged against the
        operator's account.**
      summary: One non-member, with her card and her animals
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this non member.
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNonMemberDetail'
          description: ''
  /api/v1/admin/non-members/export/:
    get:
      operationId: admin_non_members_export_retrieve
      description: |-
        The same rows the list returns, as an .xlsx — the whole filtered set, not the page. `search`, `mpp__mpp_code`, `created_by_mait`, `relation`, `no_card` and `ordering` all apply, so the file matches the screen it was taken from.

        **Carries full Aadhaar and mobile numbers**, unlike the AI-event and Pregnancy exports, which mask them. This file is what a farmer is verified *against* — an operator reads the row beside her card — and a masked number cannot be checked against anything. The same people can already read the number off the card images on the detail endpoint, so this opens no new door; every export is audit-logged against the admin who ran it, with the filters they used, and the workbook's first row says what it holds.
      summary: Export the non-member roster as a workbook
      parameters:
      - in: query
        name: no_card
        schema:
          type: boolean
        description: '`true` exports only the farmers missing a face of their Aadhaar.'
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/admin/otp-failures/:
    get:
      operationId: admin_otp_failures_retrieve
      description: |-
        The detail behind the Exceptions card's Failed OTPs queue: one row per code that did not get somebody through, with who they are, what they were trying to do, why it failed and what it is holding up.

        **Three different failures, named apart** in `outcome`, because they need three different responses. `attempts_exhausted` — the code arrived and the wrong one was entered. `never_attempted` — sent and never typed into at all, which is usually an SMS that did not arrive and is a gateway problem rather than a person's. `expired` — ran out of time part-way through. `superseded` — **not a failure**: they asked for another code and this one was retired to make way for it, which is all a resend does. `open` — still inside its window and may yet succeed.

        `?days=` defaults to 1, matching the card, and is capped at 30. `?include_unattempted=true` widens the queue to codes nobody ever typed into; they are excluded by default because the card excludes them, and the two must agree.

        `?outcome=` filters to one of the four. `?purpose=` filters to `login`, `farmer_verify`, `payment_online` or `payment_cod`.

        Mobile numbers come back in full, as they do on every other admin endpoint — this screen exists to be acted on, and acting on it usually means ringing the number.
      summary: Who is stuck at an OTP, and why
      parameters:
      - in: query
        name: days
        schema:
          type: integer
        description: 1–30, default 1
      - in: query
        name: include_unattempted
        schema:
          type: boolean
        description: Include codes nobody ever entered. Default false.
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: outcome
        schema:
          type: string
        description: attempts_exhausted / never_attempted / expired / superseded /
          open
      - in: query
        name: purpose
        schema:
          type: string
        description: OTPLog purpose
      tags:
      - dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/pregnancy/:
    get:
      operationId: admin_pregnancy_retrieve
      description: |-
        Admin oversight. The Mait-facing endpoints only ever report the caller's own checks, so this is the only view that can answer whether anybody's round is being dropped.

        Sorted most overdue first: the screen is opened to find the rounds nobody is walking, not to browse a roster. Every active Mait appears, including the ones with no checks at all — a Mait whose inseminations are too recent to have booked one reads very differently from a Mait ignoring twenty, and a list built only from check rows could not tell them apart.

        `conception_rate` is a percentage of **settled inseminations**, not of checks: an unsure result books a recheck, and an event whose second check came back pregnant did not fail. An insemination still carrying an open check is in neither half of the fraction — otherwise a Mait improves their own rate by staying at home.

        `declined` counts the visits an owner refused. It is reported beside the three findings and never added to them: nobody examined the animal, so the insemination is in neither half of the rate either. A refusal books the next attempt, so those checks are still in `open` as well — the round has not lost the animal.
      summary: Pregnancy diagnosis across every Mait
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/pregnancy/{mait_id}/:
    get:
      operationId: admin_pregnancy_retrieve_2
      description: |-
        The drill-down behind a row of the oversight table, in the same shape the app shows that Mait — so an admin reading it down the phone is looking at the same list.

        `window=due` is open checks, **oldest first**: this screen is read to find what has been dropped, and the app's soonest-first order buries exactly that at the bottom. `done` is what was recorded, newest first. `all` is both.
      summary: One Mait's pregnancy checks
      parameters:
      - in: path
        name: mait_id
        schema:
          type: integer
        required: true
      - in: query
        name: window
        schema:
          type: string
        description: '`due` (default), `done`, or `all`.'
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/pregnancy/rate/:
    get:
      operationId: admin_pregnancy_rate_retrieve
      description: |-
        The two prices, read and set from the Rates screen.

        Flat rather than per breed, unlike the insemination rate: a straw's price follows the bull it came from, and this one follows the visit, which is the same work whatever animal it is.

        **Zero means not priced, never free.** A rate nobody has entered reaches a Mait as "chargeable, amount not set" rather than as a farmer being told the visit costs nothing. `PATCH` accepts either rate on its own.
      summary: What a pregnancy diagnosis costs
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PregnancyRate'
          description: ''
    patch:
      operationId: admin_pregnancy_rate_partial_update
      description: |-
        The two prices, read and set from the Rates screen.

        Flat rather than per breed, unlike the insemination rate: a straw's price follows the bull it came from, and this one follows the visit, which is the same work whatever animal it is.

        **Zero means not priced, never free.** A rate nobody has entered reaches a Mait as "chargeable, amount not set" rather than as a farmer being told the visit costs nothing. `PATCH` accepts either rate on its own.
      summary: What a pregnancy diagnosis costs
      tags:
      - pregnancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPregnancyRateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPregnancyRateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPregnancyRateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PregnancyRate'
          description: ''
  /api/v1/admin/products/:
    get:
      operationId: admin_products_list
      description: |-
        Maintain the catalogue a Mait can ask for (SRS §6.6.1).

        Straws are absent by design — they are requested by breed, and the breed list is its own
        config. This is everything else: sheaths, gloves, liquid nitrogen, AI guns.

        Full CRUD, with one guard on delete: a product an indent or a stock row already points at
        cannot be removed, because those references carry no copy of the name and would be left
        reading as a quantity of something. Retiring takes it off the app and keeps the history
        legible. Deleting stays available for what it is actually for — a row added by mistake.
      summary: List catalogue products
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConsumableWriteList'
          description: ''
    post:
      operationId: admin_products_create
      description: '`code` is set once here and never edited — indents key on it.'
      summary: Add a catalogue product
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumableWrite'
          description: ''
  /api/v1/admin/products/{id}/:
    get:
      operationId: admin_products_retrieve
      description: |-
        Maintain the catalogue a Mait can ask for (SRS §6.6.1).

        Straws are absent by design — they are requested by breed, and the breed list is its own
        config. This is everything else: sheaths, gloves, liquid nitrogen, AI guns.

        Full CRUD, with one guard on delete: a product an indent or a stock row already points at
        cannot be removed, because those references carry no copy of the name and would be left
        reading as a quantity of something. Retiring takes it off the app and keeps the history
        legible. Deleting stays available for what it is actually for — a row added by mistake.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this consumable.
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumableWrite'
          description: ''
    put:
      operationId: admin_products_update
      description: |-
        Maintain the catalogue a Mait can ask for (SRS §6.6.1).

        Straws are absent by design — they are requested by breed, and the breed list is its own
        config. This is everything else: sheaths, gloves, liquid nitrogen, AI guns.

        Full CRUD, with one guard on delete: a product an indent or a stock row already points at
        cannot be removed, because those references carry no copy of the name and would be left
        reading as a quantity of something. Retiring takes it off the app and keeps the history
        legible. Deleting stays available for what it is actually for — a row added by mistake.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this consumable.
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConsumableWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumableWrite'
          description: ''
    patch:
      operationId: admin_products_partial_update
      description: Name, unit, rate, ordering and active state. `code` is ignored.
      summary: Edit a catalogue product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this consumable.
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConsumableWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConsumableWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConsumableWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumableWrite'
          description: ''
    delete:
      operationId: admin_products_destroy
      description: Only for a row added by mistake. A product already on an indent
        or in a Mait's stock answers `409 record-in-use` — retire it instead, which
        takes it off the request form and leaves those records still naming it.
      summary: Delete a catalogue product
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this consumable.
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
