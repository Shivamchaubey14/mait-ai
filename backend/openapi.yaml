  /api/v1/payments/{ai_event_id}/initiate/:
    post:
      operationId: payments_initiate_create
      description: |-
        A **member** pays nothing here: the charge is recorded as a deduction against her milk payment and verified immediately, because nobody is being asked for money and there is nothing to authorise.

        A **non-member** pays the Mait, so `mode` is required — `COD` for cash or `ONLINE` for UPI — and an authorisation code goes to her own number.

        The amount is the administrator's, read off the breed of the straw used. It is never taken from the request.
      summary: Record the payment for an AI event
      parameters:
      - in: path
        name: ai_event_id
        schema:
          type: integer
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentInitiateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{ai_event_id}/otp/verify/:
    post:
      operationId: payments_otp_verify_create
      description: The farmer's authorisation code for a payment she is making (SRS
        §6.5.1).
      summary: Verify the payment authorisation code
      parameters:
      - in: path
        name: ai_event_id
        schema:
          type: integer
        required: true
      tags:
      - payments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentOTPRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{ai_event_id}/proof/:
    post:
      operationId: payments_proof_create
      description: The UTR and the screenshot behind an online payment (SRS §6.5.4).
      summary: Attach proof of an online payment
