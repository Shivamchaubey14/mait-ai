  /api/v1/members/:
    get:
      operationId: members_list
      description: |-
        Member search (SRS §9.3).

        Backed by the ``member_mpp_name_idx`` composite index — the table holds 105k+ rows, so an
        unindexed search here would be the slowest thing a Mait does all day.
      summary: Search members
      parameters:
      - in: query
        name: activation_status
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mobile_no
        schema:
          type: string
      - in: query
        name: mpp__mpp_code
        schema:
          type: string
        description: Restrict to one MPP. The mobile app always sends this.
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Matches member name, member code or mobile number.
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberListList'
          description: ''
  /api/v1/members/{member_code}/:
    get:
      operationId: members_retrieve
      description: |-
        Member search (SRS §9.3).

        Backed by the ``member_mpp_name_idx`` composite index — the table holds 105k+ rows, so an
        unindexed search here would be the slowest thing a Mait does all day.
      parameters:
      - in: path
        name: member_code
        schema:
          type: string
        required: true
      tags:
