    AIEventCompleteRequest:
      type: object
      description: |-
        The one decision a completion can carry.

        Empty on every ordinary completion, which is why the body is optional: the capture flow
        closes an event it has just walked through, and there is nothing to say about it.
      properties:
        close_without_stock:
          type: boolean
          default: false
          description: Close a record whose straw has already left the Mait's stock,
            without spending another one on it. The straw is still deducted where
            it is there to deduct.
    AIEventConsumable:
      type: object
      description: One consumable a visit used, named the way the catalogue names
        it.
      properties:
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        qty:
          type: integer
          readOnly: true
      required:
      - code
      - name
      - qty
      - unit
    AIEventCreateRequest:
      type: object
      description: |-
        Start a capture (SRS §6.3 steps 1–4).

        ``client_uuid`` is generated on the device before the first sync attempt, so an event
        queued offline keeps one identity across however many retries it takes to land
        (ADR 0003). It is required rather than optional: an event that reaches the server without
        one cannot be de-duplicated afterwards, and by then the damage is a double insemination
        record.

        The straw is named by **breed**, not by number. Reading a number means lifting the goblet
        out of the liquid nitrogen, which warms every straw in it — the app would be asking a Mait
        to damage the semen in order to record it. So ``semen_breed`` opens the capture and holds
        one straw of that breed from the Mait's stock, and the gate becomes a count: ten straws of
        a breed complete ten inseminations of it.

        ``straw_unique_no`` remains accepted for the cases where a number is genuinely known
        without opening anything — a depot scan, an admin correction, a barcode on the goblet.
        Supplied, it is validated against stock as before and wins over the breed. With neither,
        the event stays a ``draft`` the Mait can come back to.
      properties:
        client_uuid:
          type: string
          format: uuid
        mpp_code:
          type: string
          minLength: 1
          maxLength: 20
        member_code:
          type: string
          maxLength: 20
        non_member_id:
          type: integer
          nullable: true
        animal_id:
          type: integer
        straw_unique_no:
          type: string
          maxLength: 30
        doses:
          type: integer
          maximum: 5
          minimum: 1
          default: 1
          description: How many straws of the breed this insemination used. Two in
            one visit is ordinary practice on a difficult animal; every one of them
            comes off the Mait's flask, and the capture is refused if the flask cannot
            cover them.
        consumables:
          type: array
          items:
            $ref: '#/components/schemas/ConsumableLineRequest'
          description: What else the visit took — sheaths, gloves — by catalogue code.
            Deducted at completion alongside the straws, and never charged to the
            farmer.
        semen_breed:
          type: string
          description: 'Breed of the straw used. This is how the capture flow names
            a straw: one of that breed is held from the Mait''s stock and deducted
            at completion, with no number read and no goblet lifted out of the nitrogen.'
          maxLength: 30
      required:
      - animal_id
      - client_uuid
      - mpp_code
