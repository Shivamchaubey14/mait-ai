      type: object
      description: |-
        One row in the list a Mait picks from before a capture (SRS §6.3 step 2, C4b).

        Deliberately not the registration shape. That one is a form being filled in; this is a
        roster being read in a yard, and the question it has to answer is "which of these is the
        woman in front of me". A name does not answer it — the same names repeat in a village —
        so the row carries the household and whose name that is, her number, and the two facts
        that identify her by her animals: how many are on her record and when she was last served.

        No Aadhaar, masked or otherwise. It is what proves she is not already a member, and that
        check happens at registration; a picker does not need it, and a screen full of them is a
        screen full of identity numbers being held up in a public place.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        father_husband_name:
          type: string
          readOnly: true
        relation:
          allOf:
          - $ref: '#/components/schemas/RelationEnum'
          readOnly: true
          description: |-
            Whether father_husband_name is her father or her husband.

            * `father` - Father
            * `husband` - Husband
        relation_display:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        animal_count:
          type: integer
          readOnly: true
          default: 0
        ai_event_count:
          type: integer
          readOnly: true
          default: 0
        last_ai_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_event_count
      - animal_count
      - created_at
      - father_husband_name
      - id
      - last_ai_at
      - mobile_no
      - name
      - relation
      - relation_display
    NonMemberRequest:
      type: object
      description: Quick-capture registration by a Mait in the field (SRS §6.3 step
        2).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        father_husband_name:
          type: string
          maxLength: 150
        relation:
          description: |-
            Whether father_husband_name is her father or her husband.

            * `father` - Father
            * `husband` - Husband
          oneOf:
          - $ref: '#/components/schemas/RelationEnum'
          - $ref: '#/components/schemas/BlankEnum'
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
          maxLength: 15
        address:
          type: string
          maxLength: 255
        aadhar_no:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 20
        consent:
          type: boolean
          writeOnly: true
          default: false
        cattle_cows:
          type: integer
          maximum: 500
          minimum: 0
        cattle_buffaloes:
          type: integer
          maximum: 500
          minimum: 0
        daily_yield_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        mpp:
          type: integer
          description: Nearest/served MPP.
      required:
      - aadhar_no
      - mobile_no
      - mpp
      - name
    OTPSendRequest:
      type: object
      description: Request a login OTP for a Mait (SRS §6.8.2).
      properties:
        mobile_no:
          type: string
