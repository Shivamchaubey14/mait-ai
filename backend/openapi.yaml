      description: |-
        Polled while `snapshots/{master}/` is in flight, keyed by the token the client sent with it.

        The wait on that endpoint is almost entirely the workbook being rebuilt, and until it is finished there is not one byte to send — so a client measuring the transfer sees nothing, then everything. This is the part that can honestly be measured: rows copied, out of rows to copy.

        Zeroes where the token is unknown, which is the ordinary state for the first poll or two before the builder has reached its first checkpoint.
