        straw_unique_no:
          type: string
          nullable: true
          readOnly: true
        breed:
          type: string
          nullable: true
          readOnly: true
        qty_available:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - breed
      - id
      - product_ref_id
      - product_type
      - product_type_display
      - qty_available
      - straw_unique_no
      - updated_at
