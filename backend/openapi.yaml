          minLength: 1
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        mobile_no:
          oneOf:
          - type: string
            pattern: ^[6-9]\d{9}$
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/AdminUserCreateRoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 10
        portal_sections:
          type: array
          items:
            $ref: '#/components/schemas/PortalSectionsEnum'
          description: Sidebar sections this account may open. The complete set, not
            an addition — anything missing from it is removed. Admins only.
      required:
      - full_name
      - password
      - role
      - username
