openapi: 3.0.3
info:
  title: Mait AI Platform API
  version: 1.0.0
  description: Artificial Insemination field operations platform for Shwetdhara Milk
    Producer Company. Serves the Mait mobile app, the admin web portal and the Indent
    Easy integration.
paths:
  /api/v1/admin/uploads/:
    get:
      operationId: admin_uploads_list
      description: SAP master-data upload and its history (SRS §6.1).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - completed_with_errors
          - failed
          - processing
          - queued
        description: |-
          * `queued` - Queued
          * `processing` - Processing
          * `completed` - Completed
          * `completed_with_errors` - Completed with errors
          * `failed` - Failed
      - in: query
        name: upload_type
        schema:
          type: string
          enum:
          - mait
          - member
          - mpp
        description: |-
          * `member` - Member Master
          * `mait` - Mait / Vendor Master
          * `mpp` - MPP / Sahayak Master
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDataUploadLogList'
          description: ''
  /api/v1/admin/uploads/{id}/:
    get:
      operationId: admin_uploads_retrieve
      description: SAP master-data upload and its history (SRS §6.1).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Data upload.
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadLog'
          description: ''
  /api/v1/admin/uploads/{id}/errors/:
    get:
      operationId: admin_uploads_errors_list
      description: Rows rejected during import, with the spreadsheet row number so
        they can be corrected at source (SRS §6.1.4). Valid rows from the same file
        are already committed.
      summary: Row-level error report
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Data upload.
        required: true
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - completed
          - completed_with_errors
          - failed
          - processing
          - queued
        description: |-
          * `queued` - Queued
          * `processing` - Processing
          * `completed` - Completed
          * `completed_with_errors` - Completed with errors
          * `failed` - Failed
      - in: query
        name: upload_type
        schema:
          type: string
          enum:
          - mait
          - member
          - mpp
        description: |-
          * `member` - Member Master
          * `mait` - Mait / Vendor Master
          * `mpp` - MPP / Sahayak Master
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUploadErrorRowList'
          description: ''
  /api/v1/admin/uploads/maits/:
    post:
      operationId: admin_uploads_maits_create
      description: SAP master-data upload and its history (SRS §6.1).
      summary: Upload the SAP Mait/Vendor Master
      tags:
      - master-data
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadLog'
          description: ''
  /api/v1/admin/uploads/members/:
    post:
      operationId: admin_uploads_members_create
      description: Accepts Member.xlsx and queues it for asynchronous import. The
        real export is ~105,000 rows with the header on row 6; both are handled. Upload
        the MPP master first — member rows referencing an unknown MPP are rejected
        individually.
      summary: Upload the SAP Member Master
      tags:
      - master-data
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadLog'
          description: ''
  /api/v1/admin/uploads/mpp/:
    post:
      operationId: admin_uploads_mpp_create
      description: Accepts Sahyak.xlsx. This file carries both the MPP and its assigned
        Sahayak (Mait), so it creates or refreshes both, and it is what establishes
        the MPP-to-Mait link. Upload it before the Member master.
      summary: Upload the SAP MPP/Sahayak Master
      tags:
      - master-data
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUploadLog'
          description: ''
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: Platform user administration (SRS §9.10).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - mait
          - super_admin
        description: |-
          * `super_admin` - Super Admin
          * `admin` - Admin / Back-office
          * `mait` - Mait (Field Agent)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
    post:
      operationId: admin_users_create
      description: Maits are not created here. They are activated from an existing
        SAP Sahayak record via `/admin/users/activate-mait/`, so every field login
        traces back to a real Sahayak.
      summary: Create an office account
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: Platform user administration (SRS §9.10).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: Platform user administration (SRS §9.10).
      summary: Update, activate or deactivate an account
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/activate-mait/:
    post:
      operationId: admin_users_activate_mait_create
      description: |-
        Gives an existing SAP Sahayak record a login and sets the mobile number their OTP will be sent to.

        The number is set here because 2,886 of 3,110 Sahayak records arrive from SAP without one, and OTP is a Mait's only way in. No password is created — that is what keeps OTP the sole route into a field account.
      summary: Activate a Mait
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaitActivationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MaitActivationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaitActivationRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin/users/pending-maits/:
    get:
      operationId: admin_users_pending_maits_retrieve
      description: Sahayak records with no login yet, so an admin can work through
        them. `needs_mobile` flags the ones whose SAP record has no number — those
        cannot receive an OTP until one is supplied at activation.
      summary: Maits awaiting activation
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/animals/:
    post:
      operationId: animals_create
      description: Belongs to exactly one of a member or a non-member. The ear tag
        is optional but unique across the platform when given, so a tag that already
        exists is rejected with the clash named rather than silently accepted.
      summary: Register an animal
      tags:
      - animals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnimalCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/animals/{id}/:
    get:
      operationId: animals_retrieve
      description: Animals belonging to members and non-members at this Mait's MPPs
        (SRS §9.4).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this animal.
        required: true
      tags:
      - animals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
    patch:
      operationId: animals_partial_update
      description: Animals belonging to members and non-members at this Mait's MPPs
        (SRS §9.4).
      summary: Correct a breed or add an ear tag
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this animal.
        required: true
      tags:
      - animals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnimalUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Animal'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: For Admin accounts. Maits authenticate through `/auth/otp/send/`
        and `/auth/otp/verify/` instead.
      summary: Log in with a username and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the refresh token so it cannot be exchanged again. The
        access token remains valid until it expires — it is short-lived by design
        (~15 min), and revoking it would mean a database lookup on every request,
        which is exactly what stateless JWT avoids.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '205':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: The first call the mobile app makes after login. For a Mait it
        returns their assigned MPP codes, which scope everything the app will show.
      summary: Current user
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/auth/otp/send/:
    post:
      operationId: auth_otp_send_create
      description: |-
        Always returns 200, whether or not the number is registered. Confirming which numbers exist would let anyone enumerate the field workforce.

        A Mait whose SAP record has no mobile number cannot receive an OTP at all; an Admin sets one at activation (SRS §6.8.2).
      summary: Send a login OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
            examples:
              Request:
                value:
                  mobile_no: '9795402473'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPSendRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                Request:
                  value:
                    mobile_no: '9795402473'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Expires after 5 minutes; 3 wrong attempts force a resend (SRS §6.5.1).
        Every send and every attempt is logged for fraud review.
      summary: Verify a login OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OTPVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/time/:
    get:
      operationId: auth_time_retrieve
      description: |-
        Server time, for the offline queue.

        The app timestamps events captured without connectivity, and field devices drift. This
        lets the client measure its own offset so a synced event reports when the insemination
        actually happened rather than when the phone thought it did (SRS §6.3.2).
      summary: Server time
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/config/breeds/:
    get:
      operationId: config_breeds_list
      description: Filter with `?animal_type=COW` or `BUFF`. The app pulls the whole
        list at login and caches it, so the picker keeps working with no signal (SRS
        §6.3.2).
      summary: Breed options by animal type
      parameters:
      - in: query
        name: animal_type
        schema:
          type: string
        description: COW or BUFF
      tags:
      - animals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BreedConfig'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Liveness — the process is up. Used by the Kubernetes liveness probe.
      summary: Liveness check
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: |-
        Readiness — dependencies are reachable.

        Failing readiness pulls the pod out of rotation without killing it, so a brief Redis
        blip degrades capacity instead of causing a crash loop (docs/DEPLOYMENT.md).
      summary: Readiness check
      tags:
      - ops
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/mait/inventory/:
    get:
      operationId: mait_inventory_retrieve
      description: |-
        The Mait's current stock, in the shape the app gates on (SRS §6.4.1).

        Refreshed at login and after every completed AI and fulfilled indent.
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/mait/inventory/check/:
    get:
      operationId: mait_inventory_check_retrieve
      description: |-
        Compare the stored balance against the ledger sum.

        Exposed because the two must never disagree — the balance is a materialised convenience
        and the ledger is the truth. A mismatch here is the earliest visible sign that something
        wrote stock without going through the service layer.
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/mait/inventory/ledger/:
    get:
      operationId: mait_inventory_ledger_list
      description: |-
        Stock movement history (SRS §9.5).

        Append-only. Summing it must always reproduce the balance; a divergence means something
        wrote stock outside the service layer and is worth investigating.
      summary: Stock movement history
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntryList'
          description: ''
  /api/v1/mait/inventory/lines/:
    get:
      operationId: mait_inventory_lines_list
      description: The individual stock lines behind the summary.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMaitInventoryList'
          description: ''
  /api/v1/members/:
    get:
      operationId: members_list
      description: |-
        Member search (SRS §9.3).

        Backed by the ``member_mpp_name_idx`` composite index — the table holds 105k+ rows, so an
        unindexed search here would be the slowest thing a Mait does all day.
      summary: Search members
      parameters:
      - in: query
        name: activation_status
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mobile_no
        schema:
          type: string
      - in: query
        name: mpp__mpp_code
        schema:
          type: string
        description: Restrict to one MPP. The mobile app always sends this.
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: search
        schema:
          type: string
        description: Matches member name, member code or mobile number.
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberListList'
          description: ''
  /api/v1/members/{member_code}/:
    get:
      operationId: members_retrieve
      description: |-
        Member search (SRS §9.3).

        Backed by the ``member_mpp_name_idx`` composite index — the table holds 105k+ rows, so an
        unindexed search here would be the slowest thing a Mait does all day.
      parameters:
      - in: path
        name: member_code
        schema:
          type: string
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
          description: ''
  /api/v1/mpp/:
    get:
      operationId: mpp_list
      description: MPP directory (SRS §9.3).
      parameters:
      - in: query
        name: district_code
        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mait
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: tehsil_code
        schema:
          type: string
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMPPListList'
          description: ''
  /api/v1/mpp/{mpp_code}/:
    get:
      operationId: mpp_retrieve
      description: MPP directory (SRS §9.3).
      parameters:
      - in: path
        name: mpp_code
        schema:
          type: string
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MPPDetail'
          description: ''
  /api/v1/mpp/{mpp_code}/assign-mait/:
    patch:
      operationId: mpp_assign_mait_partial_update
      description: Overrides the SAP-derived default (SRS §6.2.2). The assignment
        is what scopes a Mait's app, so this moves the MPP and its members out of
        one Mait's view and into another's. Pass null to unassign.
      summary: Reassign this MPP to a different Mait
      parameters:
      - in: path
        name: mpp_code
        schema:
          type: string
        required: true
      tags:
      - master-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMPPAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMPPAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMPPAssignmentRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MPPDetail'
          description: ''
  /api/v1/non-members/:
    post:
      operationId: non_members_create
      description: Non-member registration by a Mait in the field (SRS §9.3).
      tags:
      - master-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonMember'
          description: ''
  /api/v1/non-members/{id}/:
    get:
      operationId: non_members_retrieve
      description: Non-member registration by a Mait in the field (SRS §9.3).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this non member.
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonMember'
          description: ''
  /api/v1/semen-batches/{unique_no}/validate/:
    get:
      operationId: semen_batches_validate_retrieve
      description: |-
        Two rejections are kept distinct because the Mait's next action differs:

        - `not_in_stock` — the straw is not theirs. Raise an indent.
        - `already_used` — it was consumed by another AI event. A data problem worth reporting, not something to retry.

        Returns 200 with `valid: false` rather than an error status: a rejected scan is a normal outcome of the flow, not a failed request, and the app renders it as guidance rather than a crash.
      summary: Validate a scanned straw
      parameters:
      - in: path
        name: unique_no
        schema:
          type: string
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrawValidation'
          description: ''
components:
  schemas:
    AdminUser:
      type: object
      description: Read shape for the user list (SRS §9.10).
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
          description: Required for Maits — this is where the login OTP is sent.
        role:
          allOf:
          - $ref: '#/components/schemas/Role412Enum'
          readOnly: true
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        mait_name:
          type: string
          readOnly: true
        sahayak_vendor_code:
          type: string
          readOnly: true
        assigned_mpp_count:
          type: integer
          readOnly: true
      required:
      - assigned_mpp_count
      - created_at
      - email
      - full_name
      - id
      - is_active
      - last_login_at
      - mait_name
      - mobile_no
      - role
      - role_display
      - sahayak_vendor_code
      - username
    AdminUserCreateRequest:
      type: object
      description: |-
        Create an office account.

        Maits are not created here — they are activated from an existing SAP record through
        ``MaitActivationSerializer``, so a field login always traces back to a real Sahayak.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        mobile_no:
          oneOf:
          - type: string
            pattern: ^[6-9]\d{9}$
          - type: string
            maxLength: 0
        role:
          $ref: '#/components/schemas/AdminUserCreateRoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - full_name
      - password
      - role
      - username
    AdminUserCreateRoleEnum:
      enum:
      - admin
      - super_admin
      type: string
      description: |-
        * `admin` - admin
        * `super_admin` - super_admin
    Animal:
      type: object
      description: Read shape for an animal.
      properties:
        id:
          type: integer
          readOnly: true
        owner_type:
          allOf:
          - $ref: '#/components/schemas/OwnerTypeEnum'
          readOnly: true
        member:
          type: integer
          readOnly: true
          nullable: true
        non_member:
          type: integer
          readOnly: true
          nullable: true
        owner_name:
          type: string
          readOnly: true
        animal_type:
          allOf:
          - $ref: '#/components/schemas/AnimalTypeEnum'
          readOnly: true
        animal_type_display:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
          description: BreedConfig.code at time of capture.
        ear_tag_no:
          type: string
          readOnly: true
          nullable: true
          description: Optional, but unique across the platform when present (SRS
            §6.3 step 3).
        ai_event_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_event_count
      - animal_type
      - animal_type_display
      - breed
      - created_at
      - ear_tag_no
      - id
      - member
      - non_member
      - owner_name
      - owner_type
    AnimalCreateRequest:
      type: object
      description: |-
        Register an animal against a member or a non-member (SRS §6.3 step 3).

        Ownership is a nullable pair rather than a generic relation, so exactly one of the two
        must be supplied — enforced here for a readable error and again by a database constraint
        so no code path can create an orphan.
      properties:
        member_code:
          type: string
        non_member_id:
          type: integer
          nullable: true
        animal_type:
          $ref: '#/components/schemas/AnimalTypeEnum'
        breed:
          type: string
          minLength: 1
          maxLength: 30
        ear_tag_no:
          type: string
          nullable: true
          maxLength: 20
      required:
      - animal_type
      - breed
    AnimalTypeEnum:
      enum:
      - COW
      - BUFF
      type: string
      description: |-
        * `COW` - Cow
        * `BUFF` - Buffalo
    BreedConfig:
      type: object
      description: |-
        One breed option for the picker.

        Carries the Hindi label alongside the English so the app never has to hold a second
        mapping of its own — the list a Mait sees comes entirely from here.
      properties:
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_hi:
          type: string
          readOnly: true
          description: Devanagari label for the Hindi toggle.
        animal_type:
          allOf:
          - $ref: '#/components/schemas/AnimalTypeEnum'
          readOnly: true
        display_order:
          type: integer
          readOnly: true
      required:
      - animal_type
      - code
      - display_order
      - name
      - name_hi
    CurrentUser:
      type: object
      description: |-
        The authenticated user's profile (`GET /auth/me/`).

        For a Mait this also carries their assigned MPP codes, because it is the first call the
        app makes after login and the answer scopes everything the app will show (SRS §6.2.3).
        An Admin has no MPP scope, so the list is empty for them.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
          description: Required for Maits — this is where the login OTP is sent.
        role:
          allOf:
          - $ref: '#/components/schemas/Role412Enum'
          readOnly: true
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        mait_id:
          type: integer
          nullable: true
          readOnly: true
        sahayak_vendor_code:
          type: string
          nullable: true
          readOnly: true
        assigned_mpp_codes:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - assigned_mpp_codes
      - email
      - full_name
      - id
      - is_active
      - last_login_at
      - mait_id
      - mobile_no
      - role
      - role_display
      - sahayak_vendor_code
      - username
    DataUploadLog:
      type: object
      description: |-
        Upload status, polled by the admin UI while a large import runs (SRS §6.1.6).

        ``error_report`` is excluded here on purpose — it can hold thousands of rows, and the
        history list would become enormous. It has its own endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        upload_type:
          allOf:
          - $ref: '#/components/schemas/UploadTypeEnum'
          readOnly: true
        upload_type_display:
          type: string
          readOnly: true
        file_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        total_rows:
          type: integer
          readOnly: true
        processed_rows:
          type: integer
          readOnly: true
          description: Drives the progress endpoint (SRS §6.1.6).
        success_rows:
          type: integer
          readOnly: true
        failed_rows:
          type: integer
          readOnly: true
        progress_percent:
          type: integer
          readOnly: true
        error_count:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error_count
      - failed_rows
      - file_name
      - finished_at
      - id
      - processed_rows
      - progress_percent
      - started_at
      - status
      - status_display
      - success_rows
      - total_rows
      - upload_type
      - upload_type_display
      - uploaded_by
      - uploaded_by_name
    LedgerEntry:
      type: object
      description: A movement in the immutable stock ledger (SRS §9.5).
      properties:
        id:
          type: integer
          readOnly: true
        txn_type:
          allOf:
          - $ref: '#/components/schemas/TxnTypeEnum'
          readOnly: true
        txn_type_display:
          type: string
          readOnly: true
        qty:
          type: integer
          readOnly: true
          description: Positive for credits, negative for debits.
        balance_after:
          type: integer
          readOnly: true
          description: Balance immediately after this movement — makes the ledger
            auditable without replaying every prior row.
        ref_type:
          allOf:
          - $ref: '#/components/schemas/RefTypeEnum'
          readOnly: true
        ref_id:
          type: integer
          readOnly: true
          nullable: true
        product_type:
          type: string
          readOnly: true
        note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - balance_after
      - created_at
      - id
      - note
      - product_type
      - qty
      - ref_id
      - ref_type
      - txn_type
      - txn_type_display
    LogoutRequest:
      type: object
      description: Blacklist a refresh token so a stolen one cannot outlive the session
        (SRS §16).
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MPPDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        district_code:
          type: string
          readOnly: true
        tehsil_code:
          type: string
          readOnly: true
        village_code:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        mait:
          allOf:
          - $ref: '#/components/schemas/Mait'
          readOnly: true
        mait_name:
          type: string
          readOnly: true
        plant_code:
          type: string
          readOnly: true
        plant_name:
          type: string
          readOnly: true
        mpp_category:
          type: string
          readOnly: true
        state_code:
          type: string
          readOnly: true
        panchayat_code:
          type: string
          readOnly: true
        hamlet_code:
          type: string
          readOnly: true
        address_line:
          type: string
          readOnly: true
        start_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        end_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        member_count:
          type: integer
          readOnly: true
      required:
      - address_line
      - district_code
      - end_date
      - hamlet_code
      - id
      - is_active
      - mait
      - mait_name
      - member_count
      - mobile_no
      - mpp_category
      - mpp_code
      - mpp_name
      - panchayat_code
      - plant_code
      - plant_name
      - start_date
      - state_code
      - tehsil_code
      - village_code
    MPPList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        district_code:
          type: string
          readOnly: true
        tehsil_code:
          type: string
          readOnly: true
        village_code:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        mait:
          type: integer
          readOnly: true
          nullable: true
          description: Assigned Sahayak/Mait. Admin can override the SAP default (SRS
            §6.2.2).
        mait_name:
          type: string
          readOnly: true
      required:
      - district_code
      - id
      - is_active
      - mait
      - mait_name
      - mobile_no
      - mpp_code
      - mpp_name
      - tehsil_code
      - village_code
    Mait:
      type: object
      description: |-
        Mait detail.

        PII is masked by default (SRS §16). The unmasked values are reachable only from the
        restricted, audit-logged admin endpoint — never from here.
      properties:
        id:
          type: integer
          readOnly: true
        sahayak_vendor_code:
          type: string
          readOnly: true
          description: SAP Sahayak Vendor / Customer ID — the upsert key.
        name:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        aadhar_no:
          type: string
          readOnly: true
        bank_account_no:
          type: string
          readOnly: true
        ifsc_code:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        has_login:
          type: boolean
          readOnly: true
        can_receive_otp:
          type: boolean
          description: |-
            Whether this Mait can actually log in.

            Surfaced explicitly because the SAP export leaves ~93% of Sahayak mobile numbers
            blank, and a Mait without one cannot receive the OTP that is their only way in
            (docs/DATA_FINDINGS.md §1).
          readOnly: true
      required:
      - aadhar_no
      - bank_account_no
      - can_receive_otp
      - has_login
      - id
      - ifsc_code
      - is_active
      - mobile_no
      - name
      - sahayak_vendor_code
    MaitActivationRequest:
      type: object
      description: |-
        Give an existing SAP Sahayak record a login (SRS §6.8.2).

        ``mobile_no`` is accepted here because 2,886 of 3,110 Sahayak records arrive from SAP
        with no number at all, and OTP is a Mait's only way in. Setting it at activation is what
        SRS §6.8.2 describes — "activated by Admin with a mobile number for OTP-based first
        login" — and without it those Maits could never sign in
        (docs/DATA_FINDINGS.md §1).
      properties:
        sahayak_vendor_code:
          type: string
          minLength: 1
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
        username:
          type: string
          minLength: 1
          description: Defaults to the Sahayak vendor code.
          maxLength: 64
      required:
      - mobile_no
      - sahayak_vendor_code
    MaitInventory:
      type: object
      description: One product line in a Mait's stock.
      properties:
        id:
          type: integer
          readOnly: true
        product_type:
          allOf:
          - $ref: '#/components/schemas/ProductTypeEnum'
          readOnly: true
        product_type_display:
          type: string
          readOnly: true
        product_ref_id:
          type: integer
          readOnly: true
          description: SemenBatch.id for straws, Consumable.id for consumables.
        straw_unique_no:
          type: string
          nullable: true
          readOnly: true
        breed:
          type: string
          nullable: true
          readOnly: true
        qty_available:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - breed
      - id
      - product_ref_id
      - product_type
      - product_type_display
      - qty_available
      - straw_unique_no
      - updated_at
    MasterUploadRequest:
      type: object
      description: Validates the uploaded workbook before anything is queued.
      properties:
        file:
          type: string
          format: binary
          writeOnly: true
      required:
      - file
    MemberDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        member_code:
          type: string
          readOnly: true
        member_name:
          type: string
          readOnly: true
        father_husband_name:
          type: string
          readOnly: true
        gender:
          type: string
          readOnly: true
        age:
          type: integer
          readOnly: true
          nullable: true
        category:
          type: string
          readOnly: true
        education:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
          description: Payment authorisation OTPs are sent here (SRS §6.5).
        aadhar_no:
          type: string
          readOnly: true
        cattle_holding:
          type: integer
          readOnly: true
          nullable: true
        bank_name:
          type: string
          readOnly: true
        ifsc_code:
          type: string
          readOnly: true
        folio_no:
          type: string
          readOnly: true
        activation_status:
          type: string
          readOnly: true
        activation_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        can_receive_otp:
          type: boolean
          description: |-
            Whether a payment can be authorised for this member (SRS §6.5).

            1.5% of members have an unusable number. The app checks this before starting the
            flow, rather than stranding the Mait at the payment step with a completed
            insemination and no way to close the event (docs/DATA_FINDINGS.md §2).
          readOnly: true
      required:
      - aadhar_no
      - activation_date
      - activation_status
      - age
      - bank_name
      - can_receive_otp
      - category
      - cattle_holding
      - education
      - father_husband_name
      - folio_no
      - gender
      - id
      - ifsc_code
      - member_code
      - member_name
      - mobile_no
      - mpp_code
      - mpp_name
    MemberList:
      type: object
      description: |-
        Trimmed for the mobile app's member picker (SRS §6.3 step 2).

        A Mait standing at an MPP needs a name, a code and a number to confirm identity — not 54
        columns over a rural connection.
      properties:
        id:
          type: integer
          readOnly: true
        member_code:
          type: string
          readOnly: true
        member_name:
          type: string
          readOnly: true
        father_husband_name:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
          description: Payment authorisation OTPs are sent here (SRS §6.5).
        mpp_code:
          type: string
          readOnly: true
        activation_status:
          type: string
          readOnly: true
      required:
      - activation_status
      - father_husband_name
      - id
      - member_code
      - member_name
      - mobile_no
      - mpp_code
    NonMember:
      type: object
      description: Quick-capture registration by a Mait in the field (SRS §6.3 step
        2).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        mobile_no:
          type: string
          pattern: ^[6-9]\d{9}$
          maxLength: 15
        address:
          type: string
          maxLength: 255
        mpp:
          type: integer
          description: Nearest/served MPP.
        created_by_mait:
          type: integer
          readOnly: true
        consent_captured_at:
          type: string
          format: date-time
          nullable: true
          description: When the farmer consented to their details being stored.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by_mait
      - id
      - mobile_no
      - mpp
      - name
    NonMemberRequest:
      type: object
      description: Quick-capture registration by a Mait in the field (SRS §6.3 step
        2).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
          maxLength: 15
        address:
          type: string
          maxLength: 255
        mpp:
          type: integer
          description: Nearest/served MPP.
        consent_captured_at:
          type: string
          format: date-time
          nullable: true
          description: When the farmer consented to their details being stored.
      required:
      - mobile_no
      - mpp
      - name
    OTPSendRequest:
      type: object
      description: Request a login OTP for a Mait (SRS §6.8.2).
      properties:
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
      required:
      - mobile_no
    OTPVerifyRequest:
      type: object
      description: Verify the login OTP and exchange it for tokens.
      properties:
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
        otp:
          type: string
          minLength: 4
          maxLength: 8
      required:
      - mobile_no
      - otp
    OwnerTypeEnum:
      enum:
      - member
      - non_member
      type: string
      description: |-
        * `member` - Member
        * `non_member` - Non-member
    PaginatedAdminUserList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
    PaginatedDataUploadLogList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/DataUploadLog'
    PaginatedLedgerEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
    PaginatedMPPListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MPPList'
    PaginatedMaitInventoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MaitInventory'
    PaginatedMemberListList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MemberList'
    PaginatedUploadErrorRowList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/UploadErrorRow'
    PasswordLoginRequest:
      type: object
      description: |-
        Username/password login for Admin accounts (SRS §9.1).

        Maits are excluded by design: they authenticate by mobile OTP and their accounts carry
        an unusable password. Allowing a password here would create a second, weaker way into a
        field account.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    PatchedAdminUserUpdateRequest:
      type: object
      description: Activate, deactivate or amend an account (SRS §6.8.1).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        mobile_no:
          oneOf:
          - type: string
            pattern: ^[6-9]\d{9}$
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        role:
          $ref: '#/components/schemas/Role412Enum'
        password:
          type: string
          writeOnly: true
          minLength: 10
    PatchedAnimalUpdateRequest:
      type: object
      description: Correct a breed or add an ear tag later (SRS §9.4).
      properties:
        breed:
          type: string
          minLength: 1
          maxLength: 30
        ear_tag_no:
          type: string
          nullable: true
          maxLength: 20
    PatchedMPPAssignmentRequest:
      type: object
      description: |-
        Reassign an MPP to a different Mait (SRS §6.2.2).

        Overrides the SAP-derived default. The assignment is what scopes a Mait's app, so
        changing it moves both the MPP and its members out of one Mait's view and into another's.
      properties:
        sahayak_vendor_code:
          type: string
          nullable: true
          minLength: 1
          description: Null unassigns the MPP, leaving it visible to admins only.
    ProductTypeEnum:
      enum:
      - straw
      - consumable
      type: string
      description: |-
        * `straw` - Semen straw
        * `consumable` - Consumable
    RefTypeEnum:
      enum:
      - indent
      - ai_event
      - manual
      type: string
      description: |-
        * `indent` - Indent
        * `ai_event` - AI event
        * `manual` - Manual adjustment
    Role412Enum:
      enum:
      - super_admin
      - admin
      - mait
      type: string
      description: |-
        * `super_admin` - Super Admin
        * `admin` - Admin / Back-office
        * `mait` - Mait (Field Agent)
    SemenBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        unique_straw_no:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
        bull_id:
          type: string
          readOnly: true
        semen_station:
          type: string
          readOnly: true
        received_date:
          type: string
          format: date
          readOnly: true
          nullable: true
      required:
      - breed
      - bull_id
      - id
      - received_date
      - semen_station
      - unique_straw_no
    StatusEnum:
      enum:
      - queued
      - processing
      - completed
      - completed_with_errors
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `processing` - Processing
        * `completed` - Completed
        * `completed_with_errors` - Completed with errors
        * `failed` - Failed
    StrawValidation:
      type: object
      description: |-
        The answer to a scan (SRS §6.3 step 4).

        ``reason`` is a stable machine-readable code, not a message. The app branches on it to
        tell the Mait what to actually do — "raise an indent" and "report this straw" are
        different actions, and a translated sentence cannot be branched on.
      properties:
        valid:
          type: boolean
        reason:
          type: string
          nullable: true
        straw:
          allOf:
          - $ref: '#/components/schemas/SemenBatch'
          nullable: true
        available_straws:
          type: integer
      required:
      - available_straws
      - reason
      - straw
      - valid
    TokenPair:
      type: object
      description: The JWT pair every successful login returns.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TxnTypeEnum:
      enum:
      - issue
      - consume
      - return
      - adjustment
      type: string
      description: |-
        * `issue` - Issued to Mait
        * `consume` - Consumed by AI event
        * `return` - Returned to store
        * `adjustment` - Manual adjustment
    UploadErrorRow:
      type: object
      description: One rejected row in the downloadable error report (SRS §6.1.4).
      properties:
        row:
          type: integer
          nullable: true
        error:
          type: string
      required:
      - error
      - row
    UploadTypeEnum:
      enum:
      - member
      - mait
      - mpp
      type: string
      description: |-
        * `member` - Member Master
        * `mait` - Mait / Vendor Master
        * `mpp` - MPP / Sahayak Master
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
