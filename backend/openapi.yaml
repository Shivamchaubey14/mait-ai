  /api/v1/pregnancy-checks/:
    get:
      operationId: pregnancy_checks_list
      description: |-
        What this Mait owes a visit, and what they have already found.

        `window=due` is the default and the one the app opens on: everything open and due inside
        the alert window, plus everything already overdue. Overdue never falls off the list — a
        check nobody did does not stop mattering, and an animal quietly dropped from the round is
        a conception rate nobody can trust.
      summary: Pregnancy checks for the signed-in Mait
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: window
        schema:
          type: string
        description: '`due` (default) — open checks that are overdue or fall inside
          the seven-day alert window. `done` — checks already recorded, newest first.
          `all` — everything.'
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPregnancyCheckList'
          description: ''
  /api/v1/pregnancy-checks/{id}/:
    get:
      operationId: pregnancy_checks_retrieve
      description: |-
        What this Mait owes a visit, and what they have already found.

        `window=due` is the default and the one the app opens on: everything open and due inside
        the alert window, plus everything already overdue. Overdue never falls off the list — a
        check nobody did does not stop mattering, and an animal quietly dropped from the round is
        a conception rate nobody can trust.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this pregnancy check.
        required: true
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PregnancyCheck'
          description: ''
  /api/v1/pregnancy-checks/{id}/record/:
    post:
      operationId: pregnancy_checks_record_create
      description: |-
        What this Mait owes a visit, and what they have already found.

        `window=due` is the default and the one the app opens on: everything open and due inside
        the alert window, plus everything already overdue. Overdue never falls off the list — a
        check nobody did does not stop mattering, and an animal quietly dropped from the round is
        a conception rate nobody can trust.
      summary: Record what the Mait found
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this pregnancy check.
        required: true
      tags:
      - pregnancy
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCheckRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RecordCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RecordCheckRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PregnancyCheck'
          description: ''
  /api/v1/pregnancy-checks/route/:
    get:
      operationId: pregnancy_checks_route_retrieve
      description: Both orderings in one response, so the reorder screen needs no
        second request and the figures cannot move between the two screens. **Distances
        are straight lines scaled for winding, not road geometry.** There is no routing
        service configured for this platform. Good enough to order stops; not good
        enough to quote without saying what it is, which the app does.
      summary: Today's round, ordered two ways
      parameters:
      - in: query
        name: lat
        schema:
          type: number
          format: double
      - in: query
        name: lng
        schema:
          type: number
          format: double
      tags:
      - pregnancy
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reports/export/:
    get:
      operationId: reports_export_retrieve
      description: |-
        Filter with `date_from`, `date_to`, `mpp`, `mait` and `status`.

        Personal data is excluded: the file leaves this system, so it carries no Aadhaar, no bank details and no full mobile number. Every export is audit-logged against the admin who ran it, including the filters used.
      summary: Export AI events as CSV
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: mait
        schema:
          type: integer
        description: Mait id
      - in: query
        name: mpp
        schema:
          type: string
        description: MPP code
      - in: query
        name: status
        schema:
          type: string
        description: AI event status
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/mait-payment/:
    get:
      operationId: reports_mait_payment_retrieve
      description: |-
        One row per Mait: inseminations completed, the commission and retainer they earn, the straws and consumables issued to them recovered at catalogue rates, and what is left to pay.

        `?month=YYYY-MM`, defaulting to the current month. `in_progress` says whether the month is still accumulating, so a running total is never read as a settled one.

        **Counted three different ways on purpose.** Inseminations are *completed* events, by `completed_at`. Materials are what was *issued* in the month off the inventory ledger, net of returns — not what was consumed, because the dairy recovers the cost of a flask when it hands it over. `deductions` is a third figure again: the inseminations finance recovers from members' milk payments, counted at the MCC where the work happened rather than where the Mait is posted.

        Account numbers and PANs are masked here. The workbook at `/reports/mait-payment/export/` carries them in full, because it is a payment instruction.
      summary: Mait payment report for a month
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/reports/mait-payment/export/:
    get:
      operationId: reports_mait_payment_export_retrieve
      description: |-
        The same month as the preview, in the two-tab shape the office already reads: the payment sheet with its rate legend, and the per-MCC AI deduction tab.

        **This file carries full bank account numbers, IFSC codes and PANs**, and is the second place in the platform that carries unmasked personal data — the first being the non-member roster. It is a payment instruction and a masked account cannot be paid into. Admin only, behind the Mait payment section, and every export is audit-logged as `pii_access` with the month it covered. The workbook's first row states what it holds, so whoever opens it later knows how it has to be handled.
      summary: Export the Mait payment report as a workbook
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: YYYY-MM
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/reports/mait-payment/scheme/:
    get:
      operationId: reports_mait_payment_scheme_retrieve
      description: |-
        The commission per insemination, the monthly retainer and the number of inseminations that earns it, and what a straw is recovered at.

        Changing these changes every month the report is asked for, past ones included — the report is computed on read and nothing is frozen. That is deliberate: a correction to a rate should reach the months it was wrong for. A month already paid is settled by the workbook that was downloaded and audit-logged at the time.

        Consumable rates are not here. They live on `Consumable.rate` and are maintained on the Products screen, so a glove costs one thing across the whole platform.
      summary: Read or change the Mait payout scheme
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutScheme'
          description: ''
    patch:
      operationId: reports_mait_payment_scheme_partial_update
      description: |-
        The commission per insemination, the monthly retainer and the number of inseminations that earns it, and what a straw is recovered at.

        Changing these changes every month the report is asked for, past ones included — the report is computed on read and nothing is frozen. That is deliberate: a correction to a rate should reach the months it was wrong for. A month already paid is settled by the workbook that was downloaded and audit-logged at the time.

        Consumable rates are not here. They live on `Consumable.rate` and are maintained on the Products screen, so a glove costs one thing across the whole platform.
      summary: Read or change the Mait payout scheme
      tags:
      - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPayoutSchemeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPayoutSchemeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPayoutSchemeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutScheme'
          description: ''
  /api/v1/reports/pregnancy/:
    get:
      operationId: reports_pregnancy_retrieve
      description: |-
        Who agreed to a check and who did not, one row per check.

        `owner_consent` is the column this report exists for: **Accepted** where somebody examined the animal, **Declined** where the owner refused, and **Not visited yet** where the check is still owed. `outcome` carries the raw value beside it for filtering.

        Filter with `date_from` / `date_to` (on the due date), `mait`, `mpp`, `outcome` and `consent`. `search` matches a Mait's name or vendor code, so a file taken from the oversight screen matches what was on it.

        Mobile numbers are masked and Aadhaar is absent, as in every export: the file leaves this system. Every export is audit-logged against the admin who ran it.
      summary: Export pregnancy diagnosis as CSV
      parameters:
      - in: query
        name: consent
        schema:
          type: string
        description: accepted / declined / pending — the same split as `owner_consent`.
      - in: query
        name: date_from
        schema:
          type: string
        description: Due on or after, YYYY-MM-DD
      - in: query
        name: date_to
        schema:
          type: string
        description: Due on or before, YYYY-MM-DD
      - in: query
        name: mait
        schema:
          type: integer
        description: Mait id
      - in: query
        name: mpp
        schema:
          type: string
        description: MPP code
      - in: query
        name: outcome
        schema:
          type: string
        description: pregnant / not_pregnant / unsure / declined
      - in: query
        name: search
        schema:
          type: string
        description: Mait name or vendor code
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/semen-batches/{unique_no}/validate/:
    get:
      operationId: semen_batches_validate_retrieve
      description: |-
        Two rejections are kept distinct because the Mait's next action differs:

        - `not_in_stock` — the straw is not theirs. Raise an indent.
        - `already_used` — it was consumed by another AI event. A data problem worth reporting, not something to retry.

        Returns 200 with `valid: false` rather than an error status: a rejected scan is a normal outcome of the flow, not a failed request, and the app renders it as guidance rather than a crash.
      summary: Validate a scanned straw
      parameters:
      - in: path
        name: unique_no
        schema:
          type: string
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrawValidation'
          description: ''
components:
  schemas:
    AIEvent:
      type: object
      description: |-
        Read shape for an AI event.

        Names are denormalised into the response because the app renders this list offline from
        its own cache — a row that only carried foreign keys would show blanks with no signal.
      properties:
        id:
          type: integer
          readOnly: true
        client_uuid:
          type: string
          format: uuid
          readOnly: true
          description: Generated on the device before the first sync attempt.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusA5cEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        mpp:
          type: integer
          readOnly: true
        mpp_code:
          type: string
          readOnly: true
        mpp_name:
          type: string
          readOnly: true
        mait:
          type: integer
          readOnly: true
        mait_name:
          type: string
          readOnly: true
        mait_code:
          type: string
          readOnly: true
        payment:
          allOf:
          - $ref: '#/components/schemas/PaymentSummary'
          nullable: true
          readOnly: true
        owner_type:
          allOf:
          - $ref: '#/components/schemas/OwnerTypeEnum'
          readOnly: true
        member:
          type: integer
          readOnly: true
          nullable: true
        member_code:
          type: string
          readOnly: true
          default: ''
        non_member:
          type: integer
          readOnly: true
          nullable: true
        owner_name:
          type: string
          readOnly: true
        animal:
          type: integer
          readOnly: true
        animal_type:
          type: string
          readOnly: true
        breed:
          type: string
          readOnly: true
        ear_tag_no:
          type: string
          readOnly: true
        semen_breed:
          type: string
          readOnly: true
          default: ''
        doses:
          type: integer
          readOnly: true
          description: How many straws of the breed this insemination used. Two in
            one visit is ordinary practice on a difficult animal, and both come off
            the Mait's flask — so the count is the event's, not an assumption of one
            held anywhere else.
        consumables:
          type: array
          items:
            $ref: '#/components/schemas/AIEventConsumable'
          readOnly: true
        amount_due:
          type: string
          nullable: true
          readOnly: true
        straw_unique_no:
          type: string
          readOnly: true
          description: Denormalised from the batch so history survives any master-data
            cleanup.
        stock_deducted:
          type: boolean
          readOnly: true
          description: False on a record closed without a stock movement, because
            the straw it holds had already left the Mait's holding — used by another
            event, or corrected away underneath it. The insemination happened and
            the straw is spent either way; what this says is that the count cannot
            account for this event, so a report comparing straws against completions
            has the answer on the record.
        ai_photo_url:
          type: string
          readOnly: true
        photo_source:
          allOf:
          - $ref: '#/components/schemas/PhotoSourceEnum'
          readOnly: true
          description: |-
            Whether the proof photo was taken through the app's own camera or chosen from the handset's gallery. A live capture is evidence that this animal was served at this place and time; a chosen one is a photograph of something, and the record has to be able to tell an auditor which it is holding.

            * `camera` - Taken on the handset
            * `gallery` - Chosen from the gallery
        gps_lat:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
          nullable: true
        gps_lng:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,7})?$
          readOnly: true
          nullable: true
        gps_source:
          allOf:
          - $ref: '#/components/schemas/GpsSourceEnum'
          readOnly: true
          description: |-
            Where the pin came from: the handset's own position at the moment of capture, or the coordinates written into a chosen photograph's EXIF. The second can be anywhere and any time, so it is never quietly presented as the first.

            * `device` - The handset's own position
            * `photo` - Written into the photograph
        performed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the AI was actually performed — set at photo capture,
            not at sync, so an offline event reports the real time.
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_photo_url
