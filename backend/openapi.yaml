      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
          description: Required for Maits — this is where the login OTP is sent.
        role:
          allOf:
          - $ref: '#/components/schemas/Role412Enum'
          readOnly: true
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        last_login_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        mait_id:
          type: integer
          nullable: true
          readOnly: true
        sahayak_vendor_code:
          type: string
          nullable: true
          readOnly: true
        assigned_mpp_codes:
          type: array
          items:
            type: string
          readOnly: true
        portal_sections:
          type: array
          items:
            type: string
