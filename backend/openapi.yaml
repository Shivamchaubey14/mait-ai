          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
          description: ''
  /api/v1/payments/{ai_event_id}/amount/:
    get:
      operationId: payments_amount_retrieve
      description: Read off the breed of the straw used, at the rate the administrator
        set for this kind of farmer. Members and non-members are priced separately.
      summary: The amount due for an AI event
      parameters:
      - in: path
        name: ai_event_id
        schema:
          type: integer
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      responses:
