      - sahayak_vendor_code
      - username
    DataUploadLog:
      type: object
      description: |-
        Upload status, polled by the admin UI while a large import runs (SRS §6.1.6).

        ``error_report`` is excluded here on purpose — it can hold thousands of rows, and the
        history list would become enormous. It has its own endpoint.
      properties:
        id:
          type: integer
          readOnly: true
        upload_type:
          allOf:
          - $ref: '#/components/schemas/UploadTypeEnum'
          readOnly: true
        upload_type_display:
          type: string
          readOnly: true
        file_name:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DataUploadLogStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        uploaded_by:
          type: integer
          readOnly: true
        uploaded_by_name:
          type: string
          readOnly: true
        total_rows:
          type: integer
          readOnly: true
        processed_rows:
          type: integer
          readOnly: true
          description: Drives the progress endpoint (SRS §6.1.6).
        success_rows:
          type: integer
          readOnly: true
        skipped_rows:
          type: integer
          readOnly: true
          description: Rows whose record already existed and was therefore left untouched.
            A master upload inserts; it never overwrites (SRS §6.1.4).
        failed_rows:
          type: integer
          readOnly: true
        progress_percent:
          type: integer
          readOnly: true
        error_count:
          type: integer
          description: |-
            How many rows the report holds, without loading the report to find out.

            The history list defers `error_report` — see `MasterUploadViewSet.get_queryset` — so
            touching it here would fetch a megabyte of JSON per row, one query at a time. The
            length is derivable instead: one entry per rejected row up to the cap, and a whole-file
            failure stores a single explanation having rejected no rows at all.
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        finished_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - error_count
      - failed_rows
      - file_name
      - finished_at
      - id
      - processed_rows
      - progress_percent
      - skipped_rows
      - started_at
      - status
      - status_display
      - success_rows
      - total_rows
      - upload_type
      - upload_type_display
      - uploaded_by
      - uploaded_by_name
    DataUploadLogStatusEnum:
      enum:
      - queued
      - processing
      - completed
      - completed_with_errors
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `processing` - Processing
        * `completed` - Completed
        * `completed_with_errors` - Completed with errors
        * `failed` - Failed
    FarmerKeyRequest:
      type: object
      description: Exactly one of the two ways to name a farmer.
      properties:
        member_code:
          type: string
        non_member_id:
          type: integer
          nullable: true
    FarmerOTPVerifyRequest:
      type: object
      description: Exactly one of the two ways to name a farmer.
      properties:
        member_code:
          type: string
        non_member_id:
          type: integer
          nullable: true
        otp:
          type: string
          minLength: 1
          maxLength: 10
      required:
      - otp
    GpsSourceEnum:
      enum:
      - device
      - photo
      type: string
      description: |-
        * `device` - The handset's own position
        * `photo` - Written into the photograph
    Indent:
      type: object
      description: |-
        Read shape for an indent.

        Carries both statuses because they answer different questions and routinely disagree:
        ``status`` is where the request has got to in Indent Easy, ``sync_status`` is whether
        Indent Easy has even heard about it. An indent approved a week ago that never synced is
        the failure mode the admin screen exists to catch — it looks fine on one field and is
        stuck on the other.
      properties:
        id:
          type: integer
          readOnly: true
        mait:
          type: integer
          readOnly: true
        mait_name:
          type: string
          readOnly: true
        mait_code:
          type: string
          readOnly: true
        product_type:
          allOf:
          - $ref: '#/components/schemas/ProductTypeEnum'
          readOnly: true
        breed:
          type: string
          readOnly: true
          description: For straw requests (SRS §6.6.1).
        item:
          type: string
          description: |-
            What was asked for, in the words the Mait used when asking.

            Named, not categorised. "1 × Consumable" tells nobody whether the sheaths or the
            gloves are coming, and both the app and the admin screen show this string as the
            whole description of the request.

            The code fallback covers indents raised before the app started sending
            ``product_ref_id``: it used to put the product code in ``note`` instead, so those rows
            can still be named rather than being stuck reading "Consumable" forever.
          readOnly: true
        qty_requested:
          type: integer
          readOnly: true
        qty_issued:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/IndentStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        sync_status:
          allOf:
          - $ref: '#/components/schemas/SyncStatusEnum'
          readOnly: true
        sync_status_display:
          type: string
          readOnly: true
        sync_attempts:
          type: integer
          readOnly: true
        last_sync_error:
          type: string
          readOnly: true
        indent_easy_ref_no:
          type: string
          readOnly: true
          description: Reference returned by Indent Easy; dedupes GRN callbacks (SRS
            §6.6.5).
        requested_at:
          type: string
          format: date-time
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        received_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the Mait confirmed they collected it. This is where stock
            is credited — between issue and collection the goods are at the depot,
            not in the Mait's flask, and a balance that says otherwise would let them
            start an AI they cannot finish.
        note:
          type: string
          readOnly: true
      required:
      - breed
      - id
      - indent_easy_ref_no
      - issued_at
      - item
      - last_sync_error
      - mait
      - mait_code
      - mait_name
      - note
      - product_type
      - qty_issued
      - qty_requested
      - received_at
      - requested_at
      - status
      - status_display
      - sync_attempts
      - sync_status
      - sync_status_display
    IndentCreateRequest:
      type: object
      description: |-
        A Mait raising a request from the app (SRS §6.6.1).

        Straws are requested by breed rather than by straw number: which physical straws get
        issued is decided at the depot, not by the Mait asking.
      properties:
        product_type:
          type: string
          minLength: 1
          maxLength: 12
        breed:
          type: string
          maxLength: 30
        product_ref_id:
          type: integer
          nullable: true
        qty_requested:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 255
      required:
      - product_type
      - qty_requested
    IndentIssueRequest:
      type: object
      description: |-
        What an admin is handing over.

        Either shape works for straws. Numbers, when the depot slip lists them, and the record
        names exactly which straws moved. Or a bare quantity, when it does not: a bundle of a
        breed is handed over and the number that matters is the one printed on whichever straw
        gets used, which the Mait reads off at the AI step.
      properties:
        straw_numbers:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 30
          description: One per straw handed over. Optional — omit to issue by quantity
            instead.
        qty:
          type: integer
          minimum: 1
          description: Units handed over. Defaults to the full request. Ignored when
            `straw_numbers` is given, since the list already says how many.
    IndentRejectRequest:
      type: object
      description: A reason is optional to the API and asked for in the portal — the
        Mait reads it.
      properties:
        reason:
          type: string
          maxLength: 200
    IndentStatusEnum:
      enum:
      - requested
      - approved
      - issued
      - rejected
      type: string
      description: |-
        * `requested` - Requested
        * `approved` - Approved
        * `issued` - Issued
        * `rejected` - Rejected
    InventorySummary:
      type: object
      description: |-
        What the app actually gates on (SRS §6.4.1).

        ``total_straws`` is the number that decides whether a Mait can start another AI at all,
        so it is returned as a single figure rather than left to the client to add up — a client
        that sums a paginated list will eventually sum the wrong page.
      properties:
        total_straws:
          type: integer
        is_low_stock:
          type: boolean
        by_breed:
          type: object
          additionalProperties:
            type: integer
        straws:
          type: array
          items:
            type: object
            additionalProperties: {}
        consumables:
          type: array
          items:
            type: object
            additionalProperties: {}
        assets:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - assets
      - by_breed
      - consumables
      - is_low_stock
      - straws
      - total_straws
    LedgerEntry:
      type: object
