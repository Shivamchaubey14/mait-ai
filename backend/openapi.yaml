        One farmer, with everything the back office would open her record to settle.

        **This is the only place the card images are readable**, and the only place they should be.
        A Mait's own app is told a boolean, because a link to somebody's Aadhaar has no business in
        a handset's cache; an admin verifying that the number typed matches the card has to see the
        card, and that is what the whole image is for. The view records the read against the
        operator's account, the same promise the Members screen already makes about unmasking.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        father_husband_name:
          type: string
          readOnly: true
        relation:
          allOf:
          - $ref: '#/components/schemas/RelationEnum'
          readOnly: true
          description: |-
            Whether father_husband_name is her father or her husband.

            * `father` - Father
            * `husband` - Husband
        relation_display:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        address:
          type: string
          readOnly: true
        masked_aadhar:
          type: string
          readOnly: true
        aadhar_front_captured:
          type: boolean
          readOnly: true
        aadhar_back_captured:
          type: boolean
          readOnly: true
        mpp:
          type: integer
          readOnly: true
          description: Nearest/served MPP.
        mpp_code:
          type: string
          readOnly: true
          default: ''
        mpp_name:
          type: string
          readOnly: true
          default: ''
        registered_by:
          type: string
          readOnly: true
          default: ''
        registered_by_code:
          type: string
          readOnly: true
          default: ''
        animal_count:
          type: integer
          readOnly: true
          default: 0
        ai_event_count:
          type: integer
          readOnly: true
          default: 0
        cattle_cows:
          type: integer
          readOnly: true
          description: Cows she keeps, as reported at registration.
        cattle_buffaloes:
          type: integer
          readOnly: true
          description: Buffaloes she keeps, as reported at registration.
        cattle_total:
          type: integer
          readOnly: true
        daily_yield_litres:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          readOnly: true
          description: Litres of milk a day across the herd, as reported at registration.
        consent_captured_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the farmer consented to their details being stored.
        created_at:
          type: string
          format: date-time
          readOnly: true
        aadhar_front_url:
          type: string
          readOnly: true
        aadhar_back_url:
          type: string
          readOnly: true
        animals:
          type: array
          items:
            $ref: '#/components/schemas/Animal'
          readOnly: true
        payments:
          type: array
          items: {}
          description: |-
            Every payment she has made, newest first.

            Read through the AI events rather than stored against her, because a payment belongs to
            one insemination — the amount, the mode and the proof are facts about that visit, not
            about the farmer.
          readOnly: true
      required:
      - aadhar_back_captured
      - aadhar_back_url
      - aadhar_front_captured
      - aadhar_front_url
      - address
      - ai_event_count
      - animal_count
      - animals
      - cattle_buffaloes
      - cattle_cows
      - cattle_total
      - consent_captured_at
      - created_at
      - daily_yield_litres
      - father_husband_name
      - id
      - masked_aadhar
      - mobile_no
      - mpp
      - mpp_code
      - mpp_name
      - name
      - payments
      - registered_by
      - registered_by_code
      - relation
      - relation_display
