        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: 'What a member is charged for one insemination of this breed,
            in rupees. She hands over nothing: the dairy deducts it from her milk
            payment at the next payout. Zero means not priced — the list is maintained
            by hand and a rate nobody has entered must not read as free.'
        non_member_rate:
