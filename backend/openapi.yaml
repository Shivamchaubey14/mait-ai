      operationId: mpp_plants_retrieve
      description: |-
        Every distinct plant with its name and how many MPPs report into it.

        A plant is the dairy a collection point reports into. There is no plant master to read from — the code and the name arrive on each MPP row in the SAP export — so they are grouped here rather than derived in the browser from whatever page of the directory happened to load.
      summary: The plants, for the directory's filter
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/non-members/:
    get:
      operationId: non_members_list
      description: |-
        What the capture flow offers a Mait once they have said *non-member* and picked the collection point. Without it the only path was the registration form, so a farmer served a second time was registered a second time — and since one Aadhaar is now one farmer, that path simply refuses.

        Scoped to the MPPs the requesting Mait covers. Pass `mpp__mpp_code` for one of them, and `search` for her name, her number or the household name.

        Each row carries how many animals are on her record and when she was last served, because a Mait picking from a list of names in one village needs something other than the name to tell two of them apart.
      summary: The non-members already registered at an MPP
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: mpp__mpp_code
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNonMemberPickerList'
          description: ''
    post:
      operationId: non_members_create
      description: |-
        The non-members a Mait works with in the field (SRS §9.3).

        **Scoped by MPP, not by who typed the row in.** It used to be `created_by_mait`, which was
        wrong in two ways that only showed up once registering the same woman twice became
        impossible. A Mait who registered her in March and returns in August could still find her;
        a Mait who took over that MPP could not see her at all, and the only thing the app offered
        them was the registration form — which now refuses the Aadhaar as a duplicate and leaves
        them with a farmer they cannot serve and cannot re-create.

        An MPP is the unit of work here, the same way it is for members (`MemberViewSet` has always
        scoped this way), so the rule is the same rule: a Mait sees the farmers at the collection
        points they cover, and nothing else (SRS §16).
      tags:
      - master-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NonMemberRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonMember'
          description: ''
  /api/v1/non-members/{id}/:
    get:
      operationId: non_members_retrieve
      description: |-
        The non-members a Mait works with in the field (SRS §9.3).

        **Scoped by MPP, not by who typed the row in.** It used to be `created_by_mait`, which was
        wrong in two ways that only showed up once registering the same woman twice became
        impossible. A Mait who registered her in March and returns in August could still find her;
        a Mait who took over that MPP could not see her at all, and the only thing the app offered
        them was the registration form — which now refuses the Aadhaar as a duplicate and leaves
        them with a farmer they cannot serve and cannot re-create.

        An MPP is the unit of work here, the same way it is for members (`MemberViewSet` has always
        scoped this way), so the rule is the same rule: a Mait sees the farmers at the collection
        points they cover, and nothing else (SRS §16).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this non member.
        required: true
      tags:
      - master-data
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonMemberDetail'
          description: ''
  /api/v1/non-members/{id}/aadhaar/:
    patch:
      operationId: non_members_aadhaar_partial_update
      description: |-
        Multipart: `front`, `back`, or both. Photographed at registration, as evidence behind the number that was typed.

        Separate from registration rather than part of it, like an animal's portrait: the record must survive a village connection dropping a JPEG, because the flow is standing on her id by then and losing it costs the whole form again.

        The stored URLs are never returned. The response says whether each face is on file — `aadhar_front_captured` and `aadhar_back_captured` — because a Mait needs to know the step is done and a link to somebody's identity card has no business in a handset's cache.
      summary: Attach her Aadhaar card
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this non member.
        required: true
      tags:
      - master-data
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNonMemberAadhaarRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNonMemberAadhaarRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonMember'
          description: ''
  /api/v1/payments/{ai_event_id}/:
    get:
      operationId: payments_retrieve
      description: Where a payment has got to, for a screen the Mait comes back to.
      summary: Payment detail
