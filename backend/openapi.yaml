  /api/v1/mait/inventory/check/:
    get:
      operationId: mait_inventory_check_retrieve
      description: |-
        Compare the stored balance against the ledger sum.

        Exposed because the two must never disagree — the balance is a materialised convenience
        and the ledger is the truth. A mismatch here is the earliest visible sign that something
        wrote stock without going through the service layer.
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/mait/inventory/ledger/:
    get:
      operationId: mait_inventory_ledger_list
      description: |-
        Stock movement history (SRS §9.5).

        Append-only. Summing it must always reproduce the balance; a divergence means something
        wrote stock outside the service layer and is worth investigating.
      summary: Stock movement history
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLedgerEntryList'
          description: ''
  /api/v1/mait/inventory/lines/:
    get:
      operationId: mait_inventory_lines_list
      description: The individual stock lines behind the summary.
      parameters:
