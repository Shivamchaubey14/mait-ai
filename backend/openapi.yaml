    AnimalCreateRequest:
      type: object
      description: |-
        Register an animal against a member or a non-member (SRS §6.3 step 3).

        Ownership is a nullable pair rather than a generic relation, so exactly one of the two
        must be supplied — enforced here for a readable error and again by a database constraint
        so no code path can create an orphan.
      properties:
        member_code:
          type: string
        non_member_id:
          type: integer
          nullable: true
        animal_type:
          $ref: '#/components/schemas/AnimalTypeEnum'
        breed:
          type: string
          maxLength: 30
        ear_tag_no:
          type: string
          nullable: true
          maxLength: 20
      required:
      - animal_type
    AnimalTypeEnum:
      enum:
      - COW
      - BUFF
      type: string
      description: |-
        * `COW` - Cow
        * `BUFF` - Buffalo
    BlankEnum:
      enum:
      - ''
    BreedConfig:
      type: object
      description: |-
        One breed option for the picker.

        Carries the Hindi label alongside the English so the app never has to hold a second
        mapping of its own — the list a Mait sees comes entirely from here.
      properties:
        code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        name_hi:
          type: string
          readOnly: true
          description: Devanagari label for the Hindi toggle.
        animal_type:
          allOf:
          - $ref: '#/components/schemas/AnimalTypeEnum'
          readOnly: true
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: 'What a member is charged for one insemination of this breed,
            in rupees. She hands over nothing: the dairy deducts it from her milk
            payment at the next payout. Zero means not priced — the list is maintained
            by hand and a rate nobody has entered must not read as free.'
        non_member_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: 'What a non-member pays the Mait on the spot, in rupees. Kept
            apart from the member rate because the two are different prices for the
            same service: one is settled against a milk payout the dairy already owes,
            the other is cash in a yard.'
        display_order:
          type: integer
          readOnly: true
      required:
      - animal_type
      - code
      - display_order
      - name
      - name_hi
      - non_member_rate
      - rate
