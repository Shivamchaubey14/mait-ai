    Mait:
      type: object
      description: |-
        Mait detail.

        PII is masked by default (SRS §16). The unmasked values are reachable only from the
        restricted, audit-logged admin endpoint — never from here.
      properties:
        id:
          type: integer
          readOnly: true
        sahayak_vendor_code:
          type: string
          readOnly: true
          description: SAP Sahayak Vendor / Customer ID — the upsert key.
        name:
          type: string
          readOnly: true
        mobile_no:
          type: string
          readOnly: true
        aadhar_no:
          type: string
          readOnly: true
        bank_account_no:
          type: string
          readOnly: true
        ifsc_code:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        has_login:
          type: boolean
          readOnly: true
        can_receive_otp:
          type: boolean
          description: |-
            Whether this Mait can actually log in.

            Surfaced explicitly because the SAP export leaves ~93% of Sahayak mobile numbers
            blank, and a Mait without one cannot receive the OTP that is their only way in
            (docs/DATA_FINDINGS.md §1).
          readOnly: true
      required:
      - aadhar_no
      - bank_account_no
      - can_receive_otp
      - has_login
      - id
      - ifsc_code
      - is_active
      - mobile_no
      - name
      - sahayak_vendor_code
    MaitActivationRequest:
      type: object
      description: |-
        Give an existing SAP Sahayak record a login (SRS §6.8.2).

        ``mobile_no`` is accepted here because 2,886 of 3,110 Sahayak records arrive from SAP
        with no number at all, and OTP is a Mait's only way in. Setting it at activation is what
        SRS §6.8.2 describes — "activated by Admin with a mobile number for OTP-based first
        login" — and without it those Maits could never sign in
        (docs/DATA_FINDINGS.md §1).
      properties:
        sahayak_vendor_code:
          type: string
          minLength: 1
        mobile_no:
          type: string
          minLength: 1
          pattern: ^[6-9]\d{9}$
        username:
          type: string
          minLength: 1
          description: Defaults to the Sahayak vendor code.
          maxLength: 64
      required:
      - mobile_no
      - sahayak_vendor_code
    MaitInventory:
