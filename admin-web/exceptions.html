<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exceptions · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/portal.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>

  <body>
    <div class="shell" data-page="exceptions">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">Exceptions</h1>
            <p class="topbar__meta">Everything that needs a human today</p>
          </div>
          <div class="topbar__actions">
            <button class="btn" id="refresh" type="button">Refresh</button>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <section class="filters" aria-label="Filters">
          <input
            class="input filters__search"
            id="search"
            type="search"
            placeholder="Search across every queue"
            aria-label="Search across every queue"
          />
        </section>

        <section class="exceptions" aria-label="Queues">
          <article class="panel panel--warning">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="dot dot--warning" aria-hidden="true"></span> Pending payments
              </h2>
              <span class="panel__count" data-count="pending-payments">—</span>
            </div>
            <div data-rows="pending-payments"></div>
          </article>

          <article class="panel panel--error">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="dot dot--error" aria-hidden="true"></span> Failed OTPs
              </h2>
              <span class="panel__count" data-count="failed-otps">—</span>
            </div>
            <div data-rows="failed-otps"></div>
          </article>

          <article class="panel panel--error">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="dot dot--error" aria-hidden="true"></span> Low stock
              </h2>
              <span class="panel__count" data-count="low-stock">—</span>
            </div>
            <div data-rows="low-stock"></div>
          </article>
        </section>

        <section class="panel panel--warning" aria-labelledby="stale-title">
          <div class="panel__head">
            <h2 class="panel__title" id="stale-title">
              <span class="dot dot--warning" aria-hidden="true"></span> Stale indents
            </h2>
            <span class="panel__count" data-count="stale-indents">—</span>
          </div>
          <div data-rows="stale-indents"></div>
        </section>

        <!-- The same colour rule as the app, said out loud: a Mait and an admin describing
             the same problem should reach for the same word. -->
        <div class="notice">
          <span class="notice__swatch" aria-hidden="true"></span>
          <div>
            <p class="notice__title">Red means blocked work, yellow means waiting</p>
            <p class="notice__body">
              A Mait at zero straws cannot record anything; a payment pending three days is still
              moving. The same rule holds in the app.
            </p>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/exceptions.js"></script>
  </body>
</html>
