<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>

  <body>
    <div class="shell" data-page="dashboard">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">Dashboard</h1>
            <p class="topbar__meta">
              <span id="today-date">—</span> · <span id="scope">all districts</span>
            </p>
          </div>
          <div class="topbar__actions">
            <!-- Seven days first, and so the one the screen opens on: the JS reads whatever
                 is selected when the page loads, and the shortest window is the one an
                 operator checking on the day's work actually wants. Thirty is a month's
                 review, which is a thing somebody chooses rather than lands on. -->
            <select class="select" id="range" aria-label="Date range">
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
            </select>
            <button class="btn btn--primary" id="export" type="button">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 3h9l5 5v13H6zM14 3v6h6M9 14h7M9 18h7" />
              </svg>
              Export
            </button>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- SRS §6.7.1–6.7.2. The shared stat tile, same as Inventory and Coverage: four white
             cards in a row are four figures an operator has to read before knowing which one
             the page is about. Tinted in descending emphasis — today is the number the product
             exists to produce, lifetime is context — and the foot line still carries the
             good/bad colour on top of the tone. -->
        <section class="tiles" aria-label="Summary">
          <article class="tile tile--good">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 3h8v4H8zM5 7h14v14H5zM9 12h6M9 16h4" />
                </svg>
              </span>
              AI events today
            </p>
            <p class="tile__value" data-kpi="today">—</p>
            <p class="tile__foot" data-kpi="today-foot"></p>
          </article>
          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M8 14h8" />
                </svg>
              </span>
              This week
            </p>
            <p class="tile__value" data-kpi="week">—</p>
            <p class="tile__foot" data-kpi="week-foot"></p>
          </article>
          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"
                  />
                </svg>
              </span>
              This month
            </p>
            <p class="tile__value" data-kpi="month">—</p>
            <p class="tile__foot" data-kpi="month-foot"></p>
          </article>
          <article class="tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7.5V12l3.5 2" />
                </svg>
              </span>
              Lifetime
            </p>
            <p class="tile__value" data-kpi="lifetime">—</p>
            <p class="tile__foot" data-kpi="lifetime-foot"></p>
          </article>
          <!-- The only tile in the row that is not a count of events. It is deliberately last
               and deliberately here: the four beside it say how much was sold, and this says
               whether any of it worked, which is the number this platform is ultimately
               judged on. A tinted link because it is the one tile with a screen behind it. -->
          <a class="tile tile--linked" href="pregnancy.html" data-kpi="rate-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M8 12.5l2.5 2.5L16 9.5" />
                </svg>
              </span>
              Conception rate
            </p>
            <p class="tile__value" data-kpi="rate">—</p>
            <p class="tile__foot" data-kpi="rate-foot"></p>
          </a>
        </section>

        <!-- SRS §6.7.3 -->
        <section class="panel" aria-labelledby="trend-title">
          <div class="panel__head">
            <h2 class="panel__title" id="trend-title">AI events per day</h2>
            <p class="legend">
              <span class="is-completed">Completed</span>
              <span class="is-pending">Pending payment</span>
            </p>
          </div>
          <div class="chart" id="chart"></div>
        </section>

        <!-- SRS §6.7.6. Yellow is waiting, red is blocked work — the same rule the app uses,
             and the same rule Exceptions states out loud. The glyph names the queue; the wash
             says how urgent it is. -->
        <section class="exceptions" aria-label="Needs attention">
          <article class="panel panel--warning panel--linked">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="panel__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M6 4h12M6 9h12M6 14h3M9 14c6 0 6-10 0-10M6 14l8 7" />
                  </svg>
                </span>
                Pending payments
              </h2>
              <span class="panel__count" data-count="pending-payments">—</span>
              <a
                class="panel__link"
                data-link="pending-payments"
                href="ai-events.html?status=payment_pending"
                aria-label="Open the pending payments queue in AI events"
              >
                Open
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 6l6 6-6 6" />
                </svg>
              </a>
            </div>
            <div data-rows="pending-payments"></div>
          </article>

          <article class="panel panel--error panel--linked">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="panel__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M4 4h16v12H8l-4 4zM10 8l4 4M14 8l-4 4" />
                  </svg>
                </span>
                Failed OTPs
              </h2>
              <span class="panel__count" data-count="failed-otps">—</span>
              <!-- Opens the queue over this page rather than navigating to it. The card
                   can only mask a number and count it; the dialog says who is stuck, what
                   they were trying to do, which of the four things went wrong and what it is
                   holding up. In place because triage is a scan of six queues, and a link
                   that takes an operator off the screen to answer one of them costs them the
                   other five and a click back. -->
              <button
                class="panel__link"
                type="button"
                data-otp-modal
                data-link="failed-otps"
                aria-haspopup="dialog"
                aria-label="Open the failed OTP queue"
              >
                Open
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 6l6 6-6 6" />
                </svg>
              </button>
            </div>
            <div data-rows="failed-otps"></div>
          </article>

          <article class="panel panel--error panel--linked">
            <div class="panel__head">
              <h2 class="panel__title">
                <span class="panel__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
                  </svg>
                </span>
                Low stock
              </h2>
              <span class="panel__count" data-count="low-stock">—</span>
              <a
                class="panel__link"
                data-link="low-stock"
                href="inventory.html"
                aria-label="Open inventory, lowest stock first"
              >
                Open
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M9 6l6 6-6 6" />
                </svg>
              </a>
            </div>
            <div data-rows="low-stock"></div>
          </article>
        </section>

        <section class="panel panel--warning panel--linked" aria-labelledby="stale-title">
          <div class="panel__head">
            <h2 class="panel__title" id="stale-title">
              <span class="panel__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 3h9l5 5v13H6zM14 3v6h6M9 13h7M9 17h5" />
                </svg>
              </span>
              Stale indents
            </h2>
            <span class="panel__count" data-count="stale-indents">—</span>
            <a
              class="panel__link"
              data-link="stale-indents"
              href="indents.html?stale=1"
              aria-label="Open the indents waiting longest"
            >
              Open
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 6l6 6-6 6" />
              </svg>
            </a>
          </div>
          <div data-rows="stale-indents"></div>
        </section>

        <!-- Yellow, not red: a check nobody walked is waiting work, not blocked work. The Mait
             can still record events; it is the animal's answer that is late. -->
        <section class="panel panel--warning panel--linked" aria-labelledby="overdue-checks-title">
          <div class="panel__head">
            <h2 class="panel__title" id="overdue-checks-title">
              <span class="panel__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M9.5 14.5l2 2 3.5-4" />
                </svg>
              </span>
              Overdue checks
            </h2>
            <span class="panel__count" data-count="overdue-checks">—</span>
            <a
              class="panel__link"
              data-link="overdue-checks"
              href="pregnancy.html"
              aria-label="Open pregnancy diagnosis, most overdue first"
            >
              Open
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 6l6 6-6 6" />
              </svg>
            </a>
          </div>
          <div data-rows="overdue-checks"></div>
        </section>

        <!-- Yellow like the queue above it, and for a sharper reason: nobody here has failed
             at anything. The Mait walked to the yard and the owner said no, which is the
             owner's right — what makes it a queue is the pattern. One village turning Maits
             away week after week is an awareness conversation with that collection point,
             and it is the only place on this portal where that shows up at all. -->
        <section class="panel panel--warning panel--linked" aria-labelledby="declined-checks-title">
          <div class="panel__head">
            <h2 class="panel__title" id="declined-checks-title">
              <span class="panel__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M9 11V6.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V12m0-1a1.5 1.5 0 0 1 3 0v4a5 5 0 0 1-5 5h-1.6a5 5 0 0 1-4-2l-2.6-3.5a1.6 1.6 0 0 1 2.4-2L9 14"
                  />
                </svg>
              </span>
              Owners who declined
            </h2>
            <span class="panel__count" data-count="declined-checks">—</span>
            <a
              class="panel__link"
              data-link="declined-checks"
              href="pregnancy.html"
              aria-label="Open pregnancy diagnosis"
            >
              Open
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M9 6l6 6-6 6" />
              </svg>
            </a>
          </div>
          <div data-rows="declined-checks"></div>
        </section>
      </main>
    </div>

    <!--
      Vendor scripts are served locally, never from a CDN. This portal renders member PII,
      and a third-party script on the page can read everything the page can — see README.md.
    -->
    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/otp-modal.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
