<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Member · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <!-- The farmer layout (two columns), the facts list and the animals table are the
         non-member detail page's, reused here so a member reads the same way a non-member
         does. portal.css underneath carries the tiles, panels and tables. -->
    <link rel="stylesheet" href="assets/css/portal.css" />
    <link rel="stylesheet" href="assets/css/non-member.css" />
  </head>

  <body>
    <div class="shell" data-page="members">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title" id="member-name">Member</h1>
            <p class="topbar__meta" id="member-meta">—</p>
          </div>
          <div class="topbar__actions">
            <a class="btn btn--dark" href="members.html">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 12H5M11 18l-6-6 6-6" />
              </svg>
              All members
            </a>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- The questions asked before anything else: is she active, can a payment be
             authorised for her, how many animals are on her record, and how many times they
             have been served. Tones are set by member.js, because whether a record is in good
             standing is the thing being reported. -->
        <section class="tiles" aria-label="Summary">
          <article class="tile" id="status-tile">
            <p class="tile__label">
              <span class="tile__icon" id="status-icon" aria-hidden="true"></span>
              Membership
            </p>
            <p class="tile__value tile__value--pill" id="status-value"></p>
            <p class="tile__foot" id="status-foot"></p>
          </article>

          <article class="tile" id="otp-tile">
            <p class="tile__label">
              <span class="tile__icon" id="otp-icon" aria-hidden="true"></span>
              Payment OTP
            </p>
            <p class="tile__value tile__value--pill" id="otp-value"></p>
            <p class="tile__foot" id="otp-foot"></p>
          </article>

          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
                </svg>
              </span>
              Animals
            </p>
            <p class="tile__value" id="animals-value"></p>
            <p class="tile__foot" id="animals-foot"></p>
          </article>

          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 3h8v4H8zM5 7h14v14H5zM9 12h6M9 16h4" />
                </svg>
              </span>
              Inseminations
            </p>
            <p class="tile__value" id="events-value"></p>
            <p class="tile__foot">Recorded against her animals</p>
          </article>
        </section>

        <div class="farmer">
          <div class="farmer__main">
            <!-- The animals registered to her, before the first insemination can be recorded.
                 This is the whole reason the screen exists in the portal: step 3 of the capture
                 flow registers the animal, and until now there was nowhere in the back office
                 to see what a Mait had put on a member's record. -->
            <section class="panel panel--flush panel--tinted" aria-labelledby="animals-title">
              <div class="panel__head panel__head--flush">
                <h2 class="panel__title" id="animals-title">
                  <span class="panel__icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
                    </svg>
                  </span>
                  Animals
                </h2>
                <span class="panel__count" id="animals-count"></span>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Animal</th>
                      <th scope="col">Breed</th>
                      <th scope="col">Ear tag</th>
                      <th class="table__num" scope="col">AI</th>
                      <th scope="col">Last served</th>
                    </tr>
                  </thead>
                  <tbody id="animal-rows" aria-busy="true">
                    <tr class="skeleton-row" aria-hidden="true">
                      <td></td>
                      <td></td>
                      <td></td>
                      <td class="table__num"></td>
                      <td></td>
                    </tr>
                    <tr class="skeleton-row" aria-hidden="true">
                      <td></td>
                      <td></td>
                      <td></td>
                      <td class="table__num"></td>
                      <td></td>
                    </tr>
                    <tr class="skeleton-row" aria-hidden="true">
                      <td></td>
                      <td></td>
                      <td></td>
                      <td class="table__num"></td>
                      <td></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <!-- Her history across MPPs. A member who moves to another MPP is given a new member
                 code there and keeps her SAP vendor code, so the master holds her twice and her
                 inseminations are split between the two. This puts them back together. -->
            <section class="panel panel--flush" aria-labelledby="history-title">
              <div class="panel__head panel__head--flush">
                <h2 class="panel__title" id="history-title">
                  <span class="panel__icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 3" />
                    </svg>
                  </span>
                  Member code history
                </h2>
                <span class="panel__count" id="history-vendor"></span>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Member code</th>
                      <th scope="col">MPP</th>
                      <th scope="col">Status</th>
                      <th scope="col">Activated</th>
                      <th class="table__num" scope="col">AI</th>
                    </tr>
                  </thead>
                  <tbody id="code-rows" aria-busy="true">
                    <tr class="skeleton-row" aria-hidden="true">
                      <td></td>
                      <td></td>
                      <td></td>
                      <td></td>
                      <td class="table__num"></td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th scope="col">Event</th>
                      <th scope="col">Date</th>
                      <th scope="col">Under code</th>
                      <th scope="col">MPP</th>
                      <th scope="col">Animal</th>
                      <th scope="col">Mait</th>
                      <th scope="col">Status</th>
                    </tr>
                  </thead>
                  <tbody id="history-rows" aria-busy="true">
                    <tr class="skeleton-row" aria-hidden="true">
                      <td></td>
                      <td></td>
                      <td></td>
                      <td></td>
                      <td></td>
                      <td></td>
                      <td></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </div>

          <!-- Who she is, as a column of facts rather than a paragraph: this is what an operator
               reads back down the phone, and what a caller is checked against. -->
          <section class="panel panel--tinted panel--info" aria-labelledby="identity-title">
            <div class="panel__head">
              <h2 class="panel__title" id="identity-title">
                <span class="panel__icon" aria-hidden="true">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M3 5h18v14H3zM8.5 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4M5.5 16.5a3 3 0 0 1 6 0M14.5 10h4M14.5 13.5h3"
                    />
                  </svg>
                </span>
                Her record
              </h2>
            </div>
            <dl class="facts" id="facts">
              <div class="facts__row">
                <dt class="facts__label">Loading…</dt>
                <dd class="facts__value">—</dd>
              </div>
            </dl>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js?v=20261028"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/member.js?v=20261028"></script>
  </body>
</html>
