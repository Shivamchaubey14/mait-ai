<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI events · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <!-- ai-events.css imports portal.css. -->
    <link rel="stylesheet" href="assets/css/ai-events.css" />
  </head>

  <body>
    <!-- The sidebar is rendered by shell.js from one list, so twelve pages cannot drift. -->
    <div class="shell" data-page="ai-events">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">AI events</h1>
            <p class="topbar__meta"><span id="event-count">—</span></p>
          </div>
          <div class="topbar__actions">
            <!-- Ink, matching the export on Reports and on Pregnancy. Green is reserved for
                 the one action that owns a screen, and downloading a copy of a list is not
                 what this screen is for — it is what somebody does on the way out. Three
                 screens export now, and the same act should not wear three colours. -->
            <button class="btn btn--dark" id="export" type="button">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 4v12m0 0-5-5m5 5 5-5M4 20h16" />
              </svg>
              <span id="export-label">Export CSV</span>
            </button>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- Filters sit above the table they govern (SRS §9.6 list filters). -->
        <section class="filters" aria-label="Filters">
          <input
            class="input filters__search"
            id="search"
            type="search"
            placeholder="Search member, Mait or straw number"
            aria-label="Search member, Mait or straw number"
          />
          <select class="select" id="filter-mpp" aria-label="MPP">
            <option value="">All MPPs</option>
          </select>
          <select class="select" id="filter-status" aria-label="Status">
            <option value="">Status: all</option>
            <option value="draft">Draft</option>
            <option value="straw_verified">Straw verified</option>
            <option value="photo_captured">Photo captured</option>
            <option value="payment_pending">Payment pending</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
          <!-- One filter in two boxes, so they are boxed together. Loose in the bar they read
               as two unrelated dates. -->
          <div class="range">
            <input class="input" id="filter-from" type="date" aria-label="From date" />
            <svg
              class="range__arrow"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
            <input class="input" id="filter-to" type="date" aria-label="To date" />
          </div>
        </section>

        <section class="panel panel--flush events" id="events" aria-labelledby="events-title">
          <div class="panel__head panel__head--flush events__head">
            <h2 class="panel__title" id="events-title">
              <span class="panel__icon events__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 3h8v4H8zM5 7h14v14H5zM9 12h6M9 16h4" />
                </svg>
              </span>
              Inseminations
            </h2>
            <span class="panel__count" id="events-note">—</span>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">Event</th>
                  <th scope="col">Farmer</th>
                  <th scope="col">Mait</th>
                  <th scope="col">Animal</th>
                  <th scope="col">Payment</th>
                  <th scope="col">Captured</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="rows" aria-busy="true">
                <tr class="skeleton-row" aria-hidden="true">
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </section>
      </main>
    </div>

    <!--
      Vendor scripts are served locally, never from a CDN. This portal renders member PII,
      and a third-party script on the page can read everything the page can — see README.md.
    -->
    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/ai-events.js"></script>
  </body>
</html>
