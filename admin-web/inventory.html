<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inventory oversight · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <!-- inventory.css imports forms.css, which imports portal.css. -->
    <link rel="stylesheet" href="assets/css/inventory.css" />
  </head>

  <body>
    <div class="shell" data-page="inventory">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">Inventory oversight</h1>
            <p class="topbar__meta">Stock in the hands of <span id="mait-count">—</span> Maits</p>
          </div>
          <div class="topbar__actions">
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <section class="tiles" aria-label="Stock summary">
          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" /></svg
              ></span>
              Straws with Maits
            </p>
            <p class="tile__value" id="total">—</p>
            <p class="tile__foot">Held in the field right now</p>
          </article>
          <article class="tile tile--warn">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 3 2 20h20zM12 9v5M12 17.5v.5" /></svg
              ></span>
              Running low
            </p>
            <p class="tile__value tile__value--warn" id="low">—</p>
            <p class="tile__foot" id="low-foot">Need an indent soon</p>
          </article>
          <article class="tile tile--bad">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M9 9l6 6M15 9l-6 6" /></svg
              ></span>
              At zero
            </p>
            <p class="tile__value tile__value--bad" id="zero">—</p>
            <!-- Not a warning. A Mait at zero records nothing at all. -->
            <p class="tile__foot tile__foot--bad">Cannot record any event</p>
          </article>
          <article class="tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true"
                ><svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 6h16M4 12h16M4 18h10M18 16v5M15.5 18.5h5" /></svg
              ></span>
              Breeds held
            </p>
            <p class="tile__value" id="breeds">—</p>
            <p class="tile__foot">Across the whole field</p>
          </article>
        </section>

        <section class="filters" aria-label="Filters">
          <input
            class="input filters__search"
            id="search"
            type="search"
            placeholder="Search Mait or MPP"
            aria-label="Search Mait or MPP"
          />
          <button class="chip is-active" id="filter-low" type="button" aria-pressed="true">
            Low stock first
          </button>
        </section>

        <!-- Opened by clicking a row. Above the table rather than in a dialog: an admin is
             usually reading it down the phone and wants the list still in view. -->
        <section class="panel" id="holding" aria-labelledby="holding-title" hidden>
          <!-- Banded in ink, because the panel opens over a table of other Maits and the first
               thing it has to answer is which one is being looked at. -->
          <div class="holding__banner">
            <span class="holding__mark" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M5 21a7 7 0 0 1 14 0" />
              </svg>
            </span>
            <div class="holding__who">
              <h2 class="holding__name-line" id="holding-title">—</h2>
              <p class="holding__meta" id="holding-count">—</p>
            </div>
            <button class="btn holding__close" id="holding-close" type="button">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
              Close
            </button>
          </div>
          <div class="holding" id="holding-body"></div>
        </section>

        <section class="panel panel--flush" aria-label="Stock by Mait">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr id="head">
                  <th scope="col">Mait</th>
                  <th scope="col">MPPs</th>
                  <th class="table__num" scope="col">Total</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr>
                  <td class="table__empty" colspan="4">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/inventory.js"></script>
  </body>
</html>
