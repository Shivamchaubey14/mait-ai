<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MPPs &amp; assignment · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/portal.css" />
  </head>

  <body>
    <div class="shell" data-page="mpps">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">MPPs &amp; assignment</h1>
            <p class="topbar__meta"><span id="mpp-count">—</span></p>
          </div>
          <div class="topbar__actions">
            <!-- Ink rather than green: green is reserved for the one action a screen exists
                 for, and this one leaves the screen. White made it look disabled. -->
            <a class="btn btn--dark" href="coverage.html">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
              </svg>
              Coverage →
            </a>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <section class="filters" aria-label="Filters">
          <input
            class="input filters__search"
            id="search"
            type="search"
            placeholder="Search MPP name or code"
            aria-label="Search MPP name or code"
          />
          <!-- Plant, not district. A district is a bare SAP number with no master and no
               name; a plant is the dairy a collection point reports into, it arrives named on
               every MPP row, and it is the unit an admin actually works a region by. -->
          <select class="select" id="filter-plant" aria-label="Plant">
            <option value="">All plants</option>
          </select>
          <button class="chip" id="filter-unassigned" type="button" aria-pressed="false">
            Unassigned only
          </button>
        </section>

        <section class="panel panel--flush" aria-label="MPPs">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col">MPP</th>
                  <th scope="col">Code</th>
                  <th scope="col">Plant</th>
                  <th scope="col">Assigned Mait</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="rows">
                <tr>
                  <td class="table__empty" colspan="5">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </section>

        <!-- An MPP with no Mait, or with one who never activated, records nothing at all.
             Spelled out because "Assign" in a table cell does not convey that. -->
        <div class="notice notice--warn">
          <span class="notice__icon" aria-hidden="true"></span>
          <div>
            <p class="notice__title">An MPP without an active Mait records nothing</p>
            <p class="notice__body">
              Blocked means a Mait is assigned in SAP but has never been activated, so no AI event
              can be captured there. Activate them from the Maits screen.
            </p>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/mpps.js"></script>
  </body>
</html>
