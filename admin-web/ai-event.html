<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI event · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/portal.css" />
    <link rel="stylesheet" href="assets/css/event.css" />
  </head>

  <body>
    <div class="shell" data-page="ai-events">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title" id="event-title">Event</h1>
            <p class="topbar__meta" id="event-meta">—</p>
          </div>
          <div class="topbar__actions">
            <a class="btn" href="ai-events.html">← All events</a>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- The shared stat tile, same as the dashboard: the glyph names the figure and the
             tint says how to feel about it. Straw and Location are statements of fact, so they
             keep the neutral and info tones set here; Payment and Status depend on the event,
             so ai-event.js puts their tone on. -->
        <section class="tiles" aria-label="Event summary">
          <article class="tile" id="straw-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
                </svg>
              </span>
              Straw
            </p>
            <p class="tile__value" id="straw-no">—</p>
            <p class="tile__foot" id="straw-foot"></p>
          </article>
          <article class="tile" id="payment-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <!-- The rupee the dashboard's Pending payments card is drawn with. -->
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 4h12M6 9h12M6 14h3M9 14c6 0 6-10 0-10M6 14l8 7" />
                </svg>
              </span>
              Payment
            </p>
            <p class="tile__value" id="payment-amount">—</p>
            <p class="tile__foot" id="payment-foot"></p>
          </article>
          <article class="tile tile--info" id="gps-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11M12 10h.01" />
                </svg>
              </span>
              Location
            </p>
            <p class="tile__value" id="gps-value">—</p>
            <p class="tile__foot" id="gps-foot"></p>
          </article>
          <article class="tile" id="status-tile">
            <p class="tile__label">
              <span class="tile__icon" id="status-icon" aria-hidden="true"></span>
              Status
            </p>
            <p class="tile__value" id="status-value">—</p>
            <p class="tile__foot" id="status-foot"></p>
          </article>
        </section>

        <div class="event">
          <div>
            <!-- The proof photo and its stamp. Dark so the photo is the brightest thing on
                 the page, which is how it is judged. -->
            <figure class="proof" id="proof">
              <figcaption class="proof__caption" id="proof-caption">
                No photo captured yet
              </figcaption>
            </figure>

            <div class="proof proof--map" id="map">
              <p class="proof__caption" id="map-caption">No GPS recorded yet</p>
            </div>
          </div>

          <!-- SRS §9.6 — the trail a dispute is settled from, so it is readable rather than
               raw before/after payloads. -->
          <section class="panel" aria-labelledby="trail-title">
            <div class="panel__head">
              <h2 class="panel__title" id="trail-title">Audit trail</h2>
            </div>
            <ol class="trail" id="trail">
              <li class="trail__step">Loading…</li>
            </ol>
          </section>
        </div>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/ai-event.js"></script>
  </body>
</html>
