<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI event · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/portal.css" />
    <link rel="stylesheet" href="assets/css/event.css" />
  </head>

  <body>
    <div class="shell" data-page="ai-events">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title" id="event-title">Event</h1>
            <p class="topbar__meta" id="event-meta">—</p>
          </div>
          <div class="topbar__actions">
            <a class="btn btn--dark" href="ai-events.html">
              <svg
                class="btn__icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 12H5M11 18l-6-6 6-6" />
              </svg>
              All events
            </a>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- The shared stat tile, same as the dashboard: the glyph names the figure and the
             tint says how to feel about it. Straw and Location are statements of fact, so they
             keep the neutral and info tones set here; Payment and Status depend on the event,
             so ai-event.js puts their tone on. -->
        <section class="tiles" aria-label="Event summary">
          <article class="tile" id="straw-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10" />
                </svg>
              </span>
              Straw
            </p>
            <p class="tile__value tile__value--code" id="straw-no"></p>
            <p class="tile__foot" id="straw-foot"></p>
          </article>
          <article class="tile" id="payment-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <!-- The rupee the dashboard's Pending payments card is drawn with. -->
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M6 4h12M6 9h12M6 14h3M9 14c6 0 6-10 0-10M6 14l8 7" />
                </svg>
              </span>
              Payment
            </p>
            <p class="tile__value" id="payment-amount"></p>
            <p class="tile__foot" id="payment-foot"></p>
          </article>
          <article class="tile tile--info" id="gps-tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11M12 10h.01" />
                </svg>
              </span>
              Location
            </p>
            <p class="tile__value tile__value--code" id="gps-value"></p>
            <p class="tile__foot" id="gps-foot"></p>
          </article>
          <article class="tile" id="status-tile">
            <p class="tile__label">
              <span class="tile__icon" id="status-icon" aria-hidden="true"></span>
              Status
            </p>
            <p class="tile__value tile__value--pill" id="status-value"></p>
            <p class="tile__foot" id="status-foot"></p>
          </article>
        </section>

        <div class="event">
          <div class="event__evidence">
            <!-- A white card like every other card on the page, holding a dark well: the photo
                 stays the brightest thing on the screen, which is how it gets judged, without
                 the surrounding box reading as a hole in the layout. -->
            <figure class="proof proof--photo" id="proof">
              <div class="proof__frame" id="proof-frame">
                <p class="proof__empty" id="proof-empty">
                  <span class="proof__empty-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 8h4l2-3h6l2 3h4v12H3zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8" />
                    </svg>
                  </span>
                  <span class="proof__empty-text" id="proof-empty-text">No photo available</span>
                </p>
              </div>
              <figcaption class="proof__caption" id="proof-caption">
                AI proof photo — nothing captured yet
              </figcaption>
            </figure>

            <!-- Where the insemination happened, on the card rather than a tab away.
                 ai-event.js replaces the plate below with a Google map pinned to the recorded
                 point; the plate is what an event with no GPS is left with.

                 An iframe, not the Maps JavaScript API: this page renders member PII, and
                 README.md forbids third-party script on it for exactly that reason. A framed
                 map is a separate origin and cannot read this document. -->
            <figure class="proof proof--map">
              <div class="proof__frame proof__frame--map" id="map">
                <p class="map__pin" id="map-plate">
                  <span class="map__pin-icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 21s7-5.3 7-11a7 7 0 1 0-14 0c0 5.7 7 11 7 11M12 10h.01" />
                    </svg>
                  </span>
                  <span class="map__coords" id="map-empty-text">No GPS recorded yet</span>
                </p>
              </div>
              <!-- The figures stay under the map: a pin shows roughly where, and a dispute is
                   settled on exactly where. -->
              <figcaption class="proof__caption" id="map-foot">
                Where the handset was when the photo was taken
              </figcaption>
            </figure>
          </div>

          <!-- The right-hand column holds two panels now: what the visit took, and the trail
               of when. The wrapper is what keeps them one grid cell — dropped straight into
               the grid they would have become a second row, with the photo beside a gap. -->
          <div class="event__side">
            <!-- What came off the Mait's stock for this event: the doses of semen and every
                 consumable they said they used. It is the half of the record the flask is
                 reconciled against at month end, and until now it lived nowhere an admin
                 could read it. -->
            <section class="panel panel--used" aria-labelledby="used-title">
              <div class="panel__head">
                <h2 class="panel__title" id="used-title">
                  <span class="panel__icon used__icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8" />
                    </svg>
                  </span>
                  What was used
                </h2>
              </div>
              <ul class="used" id="used">
                <li class="used__row">Loading…</li>
              </ul>
            </section>

            <!-- Whether it took. An insemination is not finished when the straw is used — it
                 is finished when somebody puts a hand on the animal ninety days later — and
                 this is the screen a dispute is settled from, so the answer belongs on it.
                 More than one row when an unsure result booked a recheck: the chain is what
                 makes the outcome honest, not the last line of it. -->
            <section class="panel panel--chain" aria-labelledby="chain-title">
              <div class="panel__head">
                <h2 class="panel__title" id="chain-title">
                  <span class="panel__icon chain__icon" aria-hidden="true">
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M4 5h16v16H4zM4 9h16M8 3v4M16 3v4M9.5 14.5l2 2 3.5-4" />
                    </svg>
                  </span>
                  Did it take
                </h2>
              </div>
              <ol class="chain" id="chain">
                <li class="chain__step">Loading…</li>
              </ol>
            </section>

            <!-- SRS §9.6 — the trail a dispute is settled from, so it is readable rather than
                 raw before/after payloads. -->
            <section class="panel" aria-labelledby="trail-title">
              <div class="panel__head">
                <h2 class="panel__title" id="trail-title">
                  <span class="panel__icon trail__icon" aria-hidden="true">
                    <!-- The dashboard's clock, for the one panel that is about time. -->
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7.5V12l3.5 2" />
                    </svg>
                  </span>
                  Audit trail
                </h2>
              </div>
              <ol class="trail" id="trail">
                <li class="trail__step">Loading…</li>
              </ol>
            </section>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/lightbox.js"></script>
    <script src="assets/js/ai-event.js"></script>
  </body>
</html>
