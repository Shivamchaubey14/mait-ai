<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mait leaderboard · Mait AI Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="assets/css/portal.css" />
  </head>

  <body>
    <div class="shell" data-page="leaderboard">
      <main class="content">
        <header class="topbar">
          <div>
            <h1 class="topbar__title">Mait leaderboard</h1>
            <p class="topbar__meta"><span id="period-label">—</span> · AI count and collections</p>
          </div>
          <div class="topbar__actions">
            <!-- Shortest first, and so the one the screen opens on: this is a "who is
                 working" board, and the week just gone is the question it is usually opened
                 with. Every preset just fills the two date fields below — there is one range
                 on this screen and the presets are shortcuts to it, so the dates always say
                 what is being shown. `custom` is never chosen, only landed on by typing. -->
            <select class="select" id="period" aria-label="Period">
              <option value="7">Last 7 days</option>
              <option value="30">Last 30 days</option>
              <option value="90">Last 90 days</option>
              <option value="this-month">This month</option>
              <option value="last-month">Last month</option>
              <option value="custom">Custom range</option>
            </select>
            <button class="btn btn--logout" id="account" type="button">Log out</button>
          </div>
        </header>

        <div id="alert-region" role="alert" aria-live="polite"></div>

        <!-- What the range holds, before the ranking of who holds it. The board answers "who
             is working"; these answer "how much work was there", which is the question a
             range is usually changed to ask. -->
        <section class="tiles" aria-label="Summary">
          <article class="tile tile--good">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M8 3h8v4H8zM5 7h14v14H5zM9 12h6M9 16h4" />
                </svg>
              </span>
              AI events
            </p>
            <p class="tile__value" data-kpi="ai"></p>
            <p class="tile__foot" data-kpi="ai-foot"></p>
          </article>
          <article class="tile tile--info">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M5 21a7 7 0 0 1 14 0" />
                </svg>
              </span>
              Maits working
            </p>
            <p class="tile__value" data-kpi="maits"></p>
            <p class="tile__foot" data-kpi="maits-foot"></p>
          </article>
          <article class="tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2 6h20v12H2zM6.5 9.5h5.5M6.5 12h5.5M11 9.5c0 2.2-1.5 2.5-4.5 2.5l4.5 3.5"
                  />
                </svg>
              </span>
              Collected
            </p>
            <p class="tile__value" data-kpi="collected"></p>
            <p class="tile__foot" data-kpi="collected-foot"></p>
          </article>
          <article class="tile">
            <p class="tile__label">
              <span class="tile__icon" aria-hidden="true">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
                </svg>
              </span>
              Daily average
            </p>
            <p class="tile__value" data-kpi="average"></p>
            <p class="tile__foot" data-kpi="average-foot"></p>
          </article>
        </section>

        <section class="filters" aria-label="Filters">
          <input
            class="input filters__search"
            id="search"
            type="search"
            placeholder="Search Mait by name or Sahayak code"
            aria-label="Search Mait by name or Sahayak code"
          />
          <!-- The range, always on screen and always editable. A preset above fills these in
               rather than replacing them, so what is being counted is stated rather than
               implied by the words "last 30 days". -->
          <label class="filters__label" for="date-from">From</label>
          <input class="input" id="date-from" type="date" />
          <label class="filters__label" for="date-to">To</label>
          <input class="input" id="date-to" type="date" />
        </section>

        <section class="panel panel--flush" aria-label="Leaderboard">
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th class="table__num" scope="col">#</th>
                  <th scope="col">Mait</th>
                  <th scope="col">AI events performed</th>
                  <th class="table__num" scope="col">Collections</th>
                  <th class="table__num" scope="col">Cash share</th>
                </tr>
              </thead>
              <tbody id="rows" aria-busy="true">
                <tr class="skeleton-row" aria-hidden="true">
                  <td class="table__num"></td>
                  <td></td>
                  <td></td>
                  <td class="table__num"></td>
                  <td class="table__num"></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td class="table__num"></td>
                  <td></td>
                  <td></td>
                  <td class="table__num"></td>
                  <td class="table__num"></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td class="table__num"></td>
                  <td></td>
                  <td></td>
                  <td class="table__num"></td>
                  <td class="table__num"></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td class="table__num"></td>
                  <td></td>
                  <td></td>
                  <td class="table__num"></td>
                  <td class="table__num"></td>
                </tr>
                <tr class="skeleton-row" aria-hidden="true">
                  <td class="table__num"></td>
                  <td></td>
                  <td></td>
                  <td class="table__num"></td>
                  <td class="table__num"></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- The bar is relative to the leader, so "half the leader" is a comparison someone
             can act on rather than a raw number with no scale. -->
        <p class="topbar__meta" id="foot"></p>
      </main>
    </div>

    <script src="assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/controls.js"></script>
    <script src="assets/js/shell.js"></script>
    <script src="assets/js/leaderboard.js"></script>
  </body>
</html>
