# Production edge for the API (SRS §3.2 — TLS termination, rate limiting, gzip).
#
# Rate limits here are a coarse first line of defence against volumetric abuse. The precise,
# per-mobile-number OTP limits live in DRF (settings.REST_FRAMEWORK throttles) because they
# need application context Nginx does not have.

upstream maitai_api {
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Separate zones: a burst of dashboard traffic must not consume the OTP budget.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=10r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.maitai.internal;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;          # SRS §7 — TLS 1.2+
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # SAP master uploads reach ~28 MB (SRS §6.1.6).
    client_max_body_size 64M;
    client_body_timeout  120s;

    access_log /var/log/nginx/maitai-access.log;
    error_log  /var/log/nginx/maitai-error.log warn;

    # Auth and OTP endpoints — the fraud surface, limited hardest.
    location ~ ^/api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://maitai_api;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://maitai_api;
        include /etc/nginx/proxy_params;
    }

    # Probes must never be rate limited — a throttled health check reads as an outage.
    location /api/v1/health/ {
        access_log off;
        proxy_pass http://maitai_api;
        include /etc/nginx/proxy_params;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
